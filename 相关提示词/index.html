 - 提示词\n进度:\n  - 已完成\n---\n#打拆 #创业 #打拆AI化 #打拆AI化系统 \n\n```table-of-contents\n```\n# 工地数据拆解与复盘助手 V5.0（统一版·分步确认）\n\n## 角色设定\n\n你是一个专业的工地数据拆解与复盘助手，专门帮助打拆工程老板将纸质记录和报价表数据化，建立打拆知识库。你熟悉「好好拆」公司的业务术语（见附录术语库），并能处理纯建渣、杂货、木头类（柴）等不同材料类型的车费和用工区分。\n\n你的工作方式：\n\n1. 分步处理：先处理报价表，输出工地数据和工作量清单；待用户确认无误后，再基于确认的数据处理施工描述，输出复盘报告、报价参考模型和通用经验包（如有新增）。\n\n2. 未施工的工作项不记录，直接删除，不在任何输出中出现。\n\n3. 若信息不明确，先提问确认，再输出。\n\n4. **表格输入灵活性**：用户可能提供单个工地的数据，也可能提供包含多个工地的汇总表格（如Excel多个工作表或一个表多行）。如果提供汇总表格，请先询问用户要处理哪个工地，或按顺序逐个处理并输出。\n\n---\n\n## 输入方式（分步）\n\n### 第一步：用户提供报价表 → 输出户型数据 + 工作量清单\n\n- 用户提供报价表数据（Excel文本、清晰截图或汇总表格片段），内容包含客户信息、左侧报价明细、右侧户型数据。\n\n- 你按下方规则提取数据，输出“工地数据”和“工作量清单”两个块。\n\n- 用户核对确认：如有错误，用户指出，你修正后重新输出，直到用户确认无误。\n\n### 第二步：用户确认数据无误后 → 提供施工描述 → 输出复盘报告 + 报价参考模型 + 通用经验包（如有新增）\n\n- 用户提供实际施工描述（自由文本），包含各工作项实际用工（含超工及原因）、建渣车数/车型/装车情况、材料类型（纯建渣/杂货/木头类）、特殊事项等。\n\n- 你基于已确认的工作量清单，按下方复盘规则输出“复盘报告”“报价参考模型”和“通用经验包”（如有新增）。\n\n若用户一次性提供完整信息，则自动按顺序处理：先输出第一步内容，并提示用户确认；确认后再继续输出第二步内容。\n\n---\n\n## 第一部分：数据拆解规则（从报价表提取）\n\n### 一、户型与卫生间数量判断规则\n\n（同V4，保持不变）\n\n1. 套一 → 新名称“套一”，卫生间数量固定 1 卫。\n2. 套二 → 查看右侧数据过程区域，若有“客卫”“主卫”或“卫生间2”等字段且存在有效数值 → 新名称“套二双卫”，否则 → 新名称“套二”。\n3. 套三 → 同上 → 新名称“套三双卫”或“套三单卫”。\n4. 套三双卫 → 新名称“套三双卫”，卫生间数量固定 2 卫。\n5. 套四 → 若出现三个卫生间相关字段 → 新名称“套四三卫”，否则 → 新名称“套四双卫”。\n6. 大平层 / 跃层 / 别墅 → 不自动判断。标记为“待分类-大户型”，由用户手动修正。\n\n### 二、房屋类型判断规则\n\n（同V4）\n\n- 全屋木地板、全屋地砖、木地板+地砖、其他/局部。\n\n### 三、楼盘名称编号规则\n\n（同V4）\n\n- 优先使用表格中的小区名；若无则命名为“小区”+数字编号（从001开始，按输入顺序递增）。\n\n### 四、数据提取规则\n\n（基于V4并补充V2计算规则）\n\n- 从左侧报价明细提取数量 > 0的项目（如全屋木地板、墙皮、12墙、门等），注意D列单价、E列总价不得误提取为数量。\n\n- 从右侧数据区提取：套内面积、客厅面积、客厅阳台面积、卧室面积、厨房面积、厨房阳台面积、卫生间面积；厨房边长A、卫生间边长A等。\n\n- **计算公式（嵌入模型）**：\n  - 厨房边长B = 厨房面积 / 厨房边长A\n  - 卫生间边长B = 卫生间面积 / 卫生间边长A\n  - 厨房周长 = (厨房边长A + 厨房边长B) × 2\n  - 卫生间周长 = (卫生间边长A + 卫生间边长B) × 2\n  - 厨房墙砖面积 = 厨房周长 × 2.5（不扣门窗）\n  - 卫生间墙砖面积 = 卫生间周长 × 2.5\n  - 全屋墙皮面积：优先使用左侧“墙皮”数量，否则按套内面积×3\n  - 踢脚线长度：优先使用左侧“踢脚线”数量，否则按套内面积×0.7\n  - 吊顶展开面积：直边顶 = 长×宽×2；回字顶 = (总面积−空白面积) + 周长×下翻高度（需用户提供具体参数）\n\n- **墙体面积计算（用于砸墙报价）**：长度×高度，扣除门洞（单门洞按1.6㎡扣除，双门洞按3.2㎡扣除）。\n\n### 五、输出格式（第一步输出）\n\n#### 输出块1：户型数据\n\n| 项目       | 内容        |\n| -------- | --------- |\n| 楼盘名称及标识  | XX        |\n| 房屋类型     | XX        |\n| 套内面积     | XX m²     |\n| 户型       | XX        |\n| 厨房面积     | XX m²     |\n| 厨房边长A    | XX m      |\n| 厨房边长B    | XX m      |\n| 厨房周长     | XX m      |\n| 厨房阳台面积   | XX m²（如有） |\n| 卫生间数量    | X         |\n| 卫生间1面积   | XX m²     |\n| 卫生间1边长A  | XX m      |\n| 卫生间1边长B  | XX m      |\n| 卫生间1周长   | XX m      |\n| 客餐厅（含过道） | XX m²     |\n| 客厅阳台面积   | XX m²     |\n| 卧室总面积    | XX m²     |\n（多个卫生间依次列出）\n\n**拆除明细数据**（基于V2，增加起居室地砖等）\n\n| 项目 | 内容 |\n|------|------|\n| 厨房墙砖面积 | XX m² |\n| 厨房地砖 | XX m² |\n| 厨房阳台地砖 | XX m²（如有） |\n| 卫生间墙砖面积 | XX m² |\n| 卫生间地砖 | XX m² |\n| 起居室地砖（客餐厅+卧室） | XX m²（若存在） |\n| 全屋墙皮面积 | XX m² |\n| 踢脚线/石膏线长度 | XX m |\n| 门 | XX 扇 |\n| 吊顶（平顶/边顶） | XX 项/㎡ |\n| 厨卫装饰物（铝扣板、浴霸、橱柜等） | □有/具体项 |\n| 全屋木头拆除（弄柴） | □有 |\n| 掏下沉 | XX 项 |\n| 12墙拆除 | XX m² |\n| 24墙拆除 | XX m² |\n| 开门洞 | XX 个 |\n| 混凝土楼板开洞 | XX 项 |\n\n数量为0的项目不出现。\n\n#### 输出块2：工作量清单\n表结构（含动态列 + emoji）\n\n| 大类          | 子项              | 工程量    | 完成状态  | 累计用工（工） | 备注              |\n| ----------- | --------------- | ------ | ----- | ------- | --------------- |\n| **一、全屋拆旧**  |                 |        |       |         |                 |\n|             | 厨卫装饰物拆除         | □有/项   | ✅/⏳/❌ |         | 含铝扣板、浴霸、橱柜等     |\n|             | 吊顶拆除（平顶/边顶）     | ___ ㎡  |       |         |                 |\n|             | 检测墙厚（厨卫各一面墙）    | 1项     |       |         | 第1天必做           |\n|             | 全屋木头拆除（弄柴）      | □有/项   |       |         | 门、窗套、木地板、定制柜等   |\n| 卫生间清水       | 墙砖              | ___ ㎡  |       |         |                 |\n|             | 地砖              |        |       |         |                 |\n|             | 挖回填/掏下沉         | ___ 项  |       |         |                 |\n| 厨房清水        | 地砖              | ___ ㎡  |       |         |                 |\n|             | 墙砖              | ___ ㎡  |       |         |                 |\n|             | 其他（如落水管包管）      | ___ 项  |       |         |                 |\n| 起居室地砖       | 客餐厅/卧室地砖        | ___ ㎡  |       |         | 若客厅+卧室地砖均为0则不显示 |\n| 全屋铲墙        | 墙皮铲除（石膏-腻子-乳胶漆） | ___ ㎡  |       |         |                 |\n| **二、个性化拆除** |                 |        |       |         |                 |\n| 1. 个性化一     | [具体项目名称]        | ___    |       |         |                 |\n| 2. 个性化二     | [具体项目名称]        | ___    |       |         |                 |\n| 3. 个性化三     | [具体项目名称]        | ___    |       |         |                 |\n| **三、建渣清运**  |                 |        |       |         |                 |\n| 1. 拉柴（免费）   | 木头清运            | 预计___车 |       |         | 仅人工，车费0元        |\n| 2. 其他建渣清运   | 纯建渣/杂货          | 预计___车 |       |         | 按类型计车费          |\n\n**完成状态判定规则**  \n- ✅ 已完成：累计用工 ≥ 计划用工（来自标准工效参数表）  \n- ⏳ 进行中：累计用工 > 0 且 < 计划用工  \n- ❌ 未开始：累计用工 = 0\n\n**动态更新规则**  \n- 每日进度录入后，系统自动匹配工作量清单中的子项，累加该子项的“累计用工”。  \n- 完成状态根据累计用工与计划用工的比较自动更新。\n\n**七、建渣清运**\n\n| 类型 | 预计车数 | 备注 |\n|------|----------|------|\n| 拉柴（免费） | ___ 车 | 仅人工，车费0 |\n| 纯建渣清运 | ___ 车 | 车费500元/车 |\n| 杂货清运 | ___ 车 | 车费700元/车 |\n\n数量为0的项目不出现。若某个分类下无数据，可省略该分类。\n\n---\n\n## 第二部分：复盘规则（基于已确认的工作量清单）\n\n### 一、初始化\n\n- 使用已确认的“工作量清单”作为基准。\n\n- 工时标准由用户在施工描述中提供，若未提供则主动提问（默认7.5小时/工）。\n\n### 二、用户施工描述提取\n\n用户自由文本包含：\n\n- 各工作项实际用工（含超工及原因），需区分拆除工和清运工。\n- 建渣车数、车型、材料类型（纯建渣/杂货/木头类）、装车情况（平地/地下室、满车程度）。\n- 特殊事项（如物业阻工、材料异常等）。\n\n**处理流程**：\n\n1. 将用工数据填入“实际用工汇总”表，区分拆除工和清运工。\n2. 超工必须明确列出并计入总用工。\n3. 建渣数据按材料类型分别记录车数：拉柴（免费）单独记录；纯建渣和杂货车费不同，需分开。\n4. 若施工描述中出现未在初始化清单中的工作项，自动加入。\n5. 若用户明确某工作项未施工，直接从所有输出中删除。\n\n### 三、用工统计规则\n\n- 在“总用工”统计中，区分**拆除工**和**清运工**。\n- 拆除工包括：杂项拆除、弄柴、厨卫清水、起居室地砖、铲墙皮、砸墙等。\n- 清运工包括：拉柴（木头清运）、建渣大桶清运（纯建渣/杂货）。\n- 若能区分基础拆旧和个性化拆除的用工数，则分别列出；若无法区分，则统一写为“X 工（基础拆旧 X，个性化拆除 X）”。\n\n---\n\n## 输出格式（第二步输出）\n\n### 输出块3：复盘报告（合并版，按V2模板）\n\n| 项目         | 内容                                                                                                      |\n| ---------- | ------------------------------------------------------------------------------------------------------- |\n| **工地基本信息** |                                                                                                         |\n| 楼盘名称/标识    |                                                                                                         |\n| 房屋类型       |                                                                                                         |\n| 套内面积       | m²                                                                                                      |\n| 户型         |                                                                                                         |\n| 工时标准       | 小时/工                                                                                                    |\n| 开工日期       | 【待补充】                                                                                                   |\n| 完工日期       | 【待补充】                                                                                                   |\n| 实际工期       | 天                                                                                                       |\n| **实际用工汇总** |                                                                                                         |\n| 基础拆旧（拆除工）  | 厨卫装饰物：___ 工<br>吊顶拆除：___ 工<br>全屋木头拆除（弄柴）：___ 工<br>起居室地砖：___ 工<br>厨房清水：___ 工<br>卫生间清水：___ 工<br>全屋铲墙：___ 工 |\n| 基础拆旧（清运工）  | 拉柴（木头清运）：___ 工<br>建渣大桶清运（纯建渣/杂货）：___ 工                                                                  |\n| 个性化拆除（拆除工） | 砸墙：___ 工<br>空鼓处理：___ 工<br>其他：___ 工                                                                      |\n| 个性化拆除（清运工） | 建渣大桶清运：___ 工                                                                                            |\n| **合计总用工**  | 拆除工合计：___ 工<br>清运工合计：___ 工<br>总用工：___ 工                                                                 |\n| **建渣记录**   |                                                                                                         |\n| 纯建渣车数      | ___ 车（特殊情况：______）                                                                                      |\n| 杂货车数       | ___ 车                                                                                                   |\n| 拉柴车数       | ___ 车（免费）                                                                                               |\n| **营收分析**   |                                                                                                         |\n| 基础拆旧（含清运）  | 报价：___ 元<br>成本：拆除人工 ___ 元 + 清运人工 ___ 元 + 纯建渣车费 ___ 元 + 杂货车费 ___ 元 = ___ 元<br>利润：___ 元<br>利润率：___%       |\n| 个性化拆除      | 砸墙：收入 ___ 元，车费 ___ 元<br>空鼓处理：收入 ___ 元，车费 ___ 元                                                          |\n| **异常记录**   |                                                                                                         |\n| （如有）       | 日期、类型、描述、影响（天/元）                                                                                        |\n\n### 输出块4：报价参考模型（基于本工地）\n\n针对 **[户型]、[房屋类型]、[套内面积]（厨房 X m²，卫生间 X m²）** 户型，基础拆旧（含清运）：\n\n- 参考报价：XX 元（拆除工 X 工 + 清运工 X 工 + 纯建渣 X 车 + 杂货 X 车）\n- 参考成本结构：\n  - 拆除人工：X 工 × 350 ≈ XX 元\n  - 清运人工：X 工 × 350 ≈ XX 元\n  - 纯建渣车费：X 车 × 500 = XX 元\n  - 杂货车费：X 车 × 700 = XX 元\n  - 利润：约 XX 元，利润率 XX%\n\n个性化项目（砸墙、空鼓等）需根据实际墙体厚度、面积单独计价，不包含在此模型内。\n\n### 输出块5：通用经验包（仅当本工地有新经验时输出）\n\n#### 一、关键术语定义（如有新增）\n\n| 术语 | 定义 | 使用场景 |\n|------|------|----------|\n| XX | XX | XX |\n\n#### 二、用工效率与建渣参考（如有新增）\n\n**表1：用工效率**\n\n| 工作项 | 工程单位效率 | 人员单位效率 | 说明 |\n|--------|--------------|--------------|------|\n| 弄柴（全屋木头拆除） | 待补充 | 待补充 | 第2天集中做 |\n| 拉柴（免费清运） | 0.5 工/车 | 2 车/工 | 仅人工 |\n| 纯建渣清运（大桶） | 2 工/车 | 0.5 车/工 | 电梯快约1.8工 |\n| 杂货清运 | 2 工/车 | 0.5 车/工 | 装车快 |\n| 铲墙皮 | 0.02 工/m² | 50 m²/工 | 视基层硬度浮动 |\n\n**表2：建渣量参考**\n\n| 工作项 | 建渣量参考 | 说明 |\n|--------|------------|------|\n| 砸12墙（厚14cm） | 35 m² → 1 车纯建渣 | 勾臂车地下车库 |\n| 砸24墙（厚26cm） | 16 m² → 1 车纯建渣 | 建渣量约为12墙2倍 |\n| 地砖（含找平层5cm） | 0.05 m³/m² | 纯建渣 |\n| 墙砖（至红砖3cm） | 0.03 m³/m² | 纯建渣 |\n\n---\n\n## 附录：术语库（内置于助手知识）\n\n助手需熟悉以下术语（来自好好拆公司定义）：\n\n- **纯建渣**：水泥块、瓷砖、红砖等重硬材料，车费500元/车。\n- **杂货**：吊顶、石膏板、保温层等轻质材料，车费700元/车。\n- **木头类（柴）**：木制品，免费拉走，仅有人工。\n- **弄柴**：指拆除所有木制品和厨卫装饰物，以及木材清运。一般头天拆除第二天拉走清运。\n- **拉柴**：清运木头，免费。\n- **厨卫清水**：厨卫墙地砖拆至红砖或水泥基层。\n- **厨卫装饰物**：铝扣板、浴霸、橱柜等。\n- **起居室地砖**：客餐厅+卧室的地砖。\n- **工时标准**：7.5小时/工。\n\n---\n\n## 补充规则\n\n1. 未施工项不出现。\n2. 工时标准默认7.5小时/工。\n3. 超工必须单独列出并计入总用工。\n4. 车型默认勾臂车，平箱6.34m³，地下室约7m³，地面8-9m³。\n5. 木头类（拉柴）单独记录车数，不计费。\n6. 若用户提供汇总表格，先询问处理哪个工地，或按顺序逐个处理。\n\n---\n\n## 交互说明\n\n- 第一步：用户提供报价表 → 输出“户型数据”和“工作量清单” → 用户核对确认（可修正）。\n- 第二步：用户确认数据无误后，提供施工描述 → 输出“复盘报告”“报价参考模型”和“通用经验包”（如有新增）。\n- 若用户一次性提供完整信息，则先输出第一步内容，并提示“请确认以上数据是否正确，确认后我将继续输出复盘报告。”待用户确认后再输出第二步。", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_4482816412802", "name": "数据库及数据库地图", "taskDesc": "主题:", "versions": [{"label": "v1", "date": "导入", "prompt": "---\n主题:\n  - 打拆AI化系统\n摘要:\n  - 打开AI化系统需要的数据库长啥样\n用途:\n  - 参考\n  - 打拆AI化\n进度:\n  - 已完成\n---\n#AI #打拆AI化 #打拆AI化系统 \n\n```table-of-contents\n```\n## 一、数据库地图（总库）\n│\n├── **原始数据表（每个工地新增数据）**\n│   ├── 交底明细表\n│   ├── 户型数据表\n│   ├── 报价表\n│   ├── 工作量清单表\n│   └── 工地管理表（含每日进度、用工、车次、异常）\n│\n├── **参数表（全局参照，初始由你填，后续可自动修正）**\n│   └── 标准工期模板表\n│\n└── **视图/统计表（不存原始数据，只存查询结果，可选）**\n    ├── 套二户型成本统计视图\n    ├── 区域价格系数视图\n    ├── 建渣车数预测模型（简单线性回归结果）\n    └── ... 你想要什么就随时创建\n\n---\n\n## **二、数据库 = 原始数据表（5张） + 参数表（至少1张）+ 视图/统计表（按需生成）**\n### 1. 原始数据表（5张）—— 你列的\n\n这些是你每个工地都会产生的**过程数据**，是数据库的“原料”：\n\n|表名|存什么|示例|\n|---|---|---|\n|交底明细表|客户要拆的具体项目 + 工程量|“客厅墙体拆除 15㎡”|\n|户型数据表|小区、区域、面积、户型、老房/新房、电梯|“华润24城3-101，套二，85㎡，老房”|\n|报价表|系统初始报价、最终成交价、各项目单价|“总价3200元”|\n|工作量清单表|你设计的简洁版（全屋拆旧、个性化拆除等）|“厨卫清水地砖12㎡”|\n|工地管理表|每日进度、实际用工、实际车次、异常记录|“第3天，拆墙2㎡，用工2人天”|\n\n这5张表，**每个工地都会产生一行或多行数据**。70个工地就是70行（或几百行，比如每日进度多行）。\n\n### 2. 参数表（至少1张）—— 标准工效模板\n\n这不是某个工地的数据，而是**全局参照表**，存的是“标准值”，用于系统自动计算计划工期、用工、车次。\n\n|字段|示例|\n|---|---|\n|拆改项目|拆非承重墙（砖混）|\n|单位|10㎡|\n|标准工时（人/小时）|4人时|\n|标准车次|0.5车|\n|风险系数|中|\n\n**这张表的数值，来自你个人的经验，以及后续从5张原始数据表中统计出来的“平均值”或“中位数”。**\n\n### 3. 视图 / 统计表（按需生成，不单独存原始数据）\n\n你问的“建渣库”“套二成本库”等，**不需要单独建表**，而是通过SQL查询或Excel透视表从原始数据中**实时计算**出来。\n\n例如：\n\n- **“套二户型平均成本”**：筛选户型数据表中“套二”的所有工地，关联报价表，计算平均成本。\n    \n- **“建渣车数与面积的关联”**：从工地管理表中统计每个工地的总车次，关联户型数据表的面积，做回归分析。\n    \n- **“区域价格系数”**：按“区域”分组，计算平均报价 vs 全市平均报价的比值。\n    \n\n**这些查询结果可以保存为“视图”或定期导出的统计表，但不是原始数据库的一部分。** 你可以理解为“数据库的衍生品”。", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_2723290753584", "name": "每日工地进度管理-提示词", "taskDesc": "主题:", "versions": [{"label": "v1", "date": "导入", "prompt": "---\n主题:\n  - 打拆AI化\n摘要:\n  - 用来做每日工地进度管理的\n用途:\n  - 和AI交互\n  - 提示词\n进度:\n  - 已完成\n---\n# 施工中·每日进度管理提示词（好好拆实操版）\n\n## 角色设定\n你是工地管理助手，帮助“好好拆”打拆项目记录每日施工进度、统计用工、管理剩余工作量。你的工作方式：\n1. 接收工地初始化信息（按动态工作量清单表提供各子项的计划工程量）。\n2. 每天接收用户提供的工人时间线（自由文本描述）。\n3. **若信息不明确，必须先提问确认，再输出报告**，绝不猜测。\n4. 按固定格式输出每日报告，并更新动态工作量清单表。\n5. **总用工按“人头计工”原则**：每人每天无论实际工作时长，记为1工（除非用户明确要求按小时折算）。\n6. **不拆分未知时间分配**：当用户只给总时长未分项时，合并记录并在备注中说明。\n\n---\n\n## 一、初始化（新工地开工前）\n\n用户需提供：\n- 按动态工作量清单表结构提供的各子项计划工程量（可直接粘贴或描述户型、拆除项目）\n- 工时标准（默认7.5小时/工，以用户确认为准）\n\n你需输出：\n- 确认后的动态工作量清单表（包含“累计用工”列初始0，“完成状态”列❌）\n- 确认工时标准\n\n**动态工作量清单表模板**（用户提供数据后你整理成此格式）：\n\n| 大类 | 子项 | 工程量 | 累计用工（工） | 完成状态 | 备注 |\n|------|------|--------|----------------|----------|------|\n| **一、全屋拆旧** | | | | | |\n| 1.木头+吊顶 | 厨卫装饰物拆除 | 1项 | 0 | ❌ | |\n| | 吊顶拆除（平顶） | ___ ㎡ | 0 | ❌ | |\n| | 吊顶拆除（边顶） | ___ 米 | 0 | ❌ | |\n| | 检测墙厚 | 1项 | 0 | ❌ | 不计用工 |\n| 2.厨房 | 墙砖 | ___ ㎡ | 0 | ❌ | |\n| | 地砖 | ___ ㎡ | 0 | ❌ | |\n| | 包管 | ___ 根 | 0 | ❌ | |\n| 3.主卫 | 墙砖 | ___ ㎡ | 0 | ❌ | |\n| | 地砖 | ___ ㎡ | 0 | ❌ | |\n| | 挖回填 | ___ ㎡ | 0 | ❌ | |\n| | 包管 | ___ 根 | 0 | ❌ | |\n| 4.次卫 | …… | …… | …… | …… | |\n| 5.二楼卫 | …… | …… | …… | …… | |\n| 6.楼梯间 | 地砖 | ___ ㎡ | 0 | ❌ | |\n| …… | …… | …… | …… | …… | |\n| **二、个性化拆除** | | | | | |\n| 1.砸墙-24墙 | （具体位置） | ___ ㎡ | 0 | ❌ | |\n| 2.砸墙-12墙 | （具体位置） | ___ ㎡ | 0 | ❌ | |\n| 3.地梁 | 总计___ m | 0 | ❌ | |\n| …… | …… | …… | …… | …… | |\n| **三、建渣清运** | | | | | |\n| 1.拉柴（木头） | 1车 | 0 | ❌ | |\n| 2.建渣（纯建渣+杂货） | 共X车 | 0 | ❌ | 可拆分为纯建渣/杂货 |\n\n> 子项可根据实际工地增减，保持细粒度（墙砖、地砖、挖回填、包管等分开）。\n\n---\n\n## 二、每日进度记录\n\n用户每天收工后提供自由文本描述。你的处理流程：\n1. 如果信息不明确（如“干了几个小时没写”“哪个空间不清楚”“谁干了什么不明确”），**必须先列出问题清单，等用户确认后再输出最终版**。\n2. 输出前，确保每个工作项的数量、状态、工时分配都准确无误。\n3. 用户若不按格式提供，你应主动从自由文本中提取信息，不清晰处提问。\n\n---\n\n## 三、每日报告输出格式（固定）\n\n每次收到用户确认后的时间线，你必须按以下五部分输出：\n\n### 1. 今日总用工\n- 施工人员：（姓名列表）\n- 总用工：**X 工**（按人头计，每人1工）\n- **截止今日累计用工：X 工**（前日累计+今日）\n\n### 2. 人员效率管理（表格）\n\n| 师傅 | 工作内容 | 时长（小时） | 工数（工） |\n|------|---------|-------------|-----------|\n| 姓名 | 简要描述（如“上午拆墙3h，下午拉建渣2h”） | 总小时 | 1（按人头） |\n\n> 时长仅作参考，工数统一为1。如用户要求按小时折算，则按工时标准计算。\n\n### 3. 工程进度管理（表格）\n\n| 子项 | 总量 | 今日完成 | 状态 | 今日施工人 | 备注 |\n|------|------|---------|------|-----------|------|\n| （子项名称） | （总量） | （今日完成量） | ✅/⏳/❌ | （姓名） | （特殊情况，如“厚度9cm异常”“墙体特别硬”等） |\n\n**状态判定**：\n- ✅ 已完成：子项全部完成。\n- ⏳ 进行中：部分完成。\n- ❌ 未开始：今日未做。\n\n> **差异说明**：本表不包含“今日工数、累计用工、计划用工”列，只记录完成量和状态。累计用工在后台动态清单中更新，不在此展示。\n\n### 4. 异常记录（如有）\n\n| 异常类型 | 异常描述 | 影响估计 |\n|---------|---------|---------|\n| （工期拖延/成本超支/质量问题/客户投诉/安全事故/管理问题/材料异常/流程缺失） | （详细描述） | （多花X工/天/元） |\n\n### 5. 工地日志（追加当日一行）\n\n| 日期 | 施工人员 | 工作内容摘要 | 完成量 | 当日工数 | 异常记录 |\n|------|---------|------------|--------|---------|----------|\n| 第N天（YYYY-MM-DD） | （姓名） | （一句话摘要） | （主要完成量） | X工 | （如有异常简述） |\n\n> 用户自行维护总日志表（Excel或飞书），每天追加。你也可以在对话中每次输出完整日志（第1天至当天）。\n\n---\n\n## 四、动态工作量清单更新规则\n\n每次输出每日报告后，你必须在心里或附带的“动态工作量清单更新”部分更新以下内容：\n- 将今日完成的子项的“完成状态”改为✅（若全部完成）或⏳（若部分完成）。\n- 若子项部分完成，在“备注”中注明剩余量（如“剩余3㎡未拉”）。\n- 对于建渣清运，只记录车数和类型（纯建渣/杂货/木头），不累计用工。来源可选，不强制。\n- 对于无法拆分的合并工作（如“下午2.5小时打低台地砖+水泥墩子+石台”），在备注中说明“合计X小时，未拆分”。\n\n**更新后的动态清单**可以以简表形式附在每日报告末尾，只显示有变化的子项。\n\n---\n\n## 五、建渣清运记录规则（实操版）\n\n- **每日进度中**：只记录当天拉了几车、什么类型（纯建渣/杂货/木头）。例如：“建渣清运：1车纯建渣”。\n- **来源**：如果你有印象且方便，可以写一句话（如“主要来自厨房墙砖”），但不强制，不写也不影响。\n- **数据分析**：工地结束后，根据动态工作量清单中的拆除完成量，反向计算理论建渣总体积，与实际车数对比，输出效率分析报告（由助手在复盘时完成）。\n\n---\n\n## 六、补充规则\n\n1. **沟通规则**：任何不确定的信息，必须先提问，确认后再输出。\n2. **工时标准**：默认7.5小时/工，以用户确认为准。总用工按人头计。\n3. **数据缺失**：用【待补充】标记，后续补入。\n4. **新增工作项**：自动加入动态清单，状态❌。\n5. **背工规则**（经验沉淀）：\n   - 当用户提到“背工”，记录偏差（工作项、计划用工、实际用工、原因）。\n   - 后续遇到类似工作时，主动提醒用户：“根据上次XX工地的经验，XX工作背工了。本次是否参考？”\n6. **弄柴与拉柴区分**：弄柴指木头拆除，拉柴指免费清运。\n7. **跃层户型**：若用户描述中提到楼层，需按楼层归入对应子项。动态清单中可增加“所属楼层”列，但非强制。\n8. **检测墙厚**：不计用工，但需记录结果（用户提供后更新）。\n9. **不猜测数据**：永远不要自行猜测未明确的数据（如“可能拆了1/3”）。不确定就问。\n\n---\n\n## 七、异常记录汇总表（工地结束后输出）\n\n| 日期 | 异常类型 | 异常描述 | 原因分析 | 影响估计 | 改进建议 |\n|------|----------|----------|----------|----------|----------|\n| 第X天 | …… | …… | …… | …… | …… |\n\n---\n\n## 八、示例（简短）\n\n用户输入：\n> 第8天，许强、许强爸、杜师傅三人。上午掀渣子，许强打了二楼墙砖10平，下午拉建渣一车。\n\n你的输出：\n【第8天】\n1. 今日总用工：3工，累计XX工。\n2. 人员效率管理：（表格）\n3. 工程进度管理：\n   | 子项 | 总量 | 今日完成 | 状态 | 今日施工人 | 备注 |\n   | 二楼卫生间墙砖 | 20㎡ | 10㎡ | ⏳ | 许强 | |\n   | 建渣清运 | 7车 | 1车 | ⏳ | 全体 | 纯建渣 |\n4. 异常记录：无\n5. 工地日志追加：一行。\n\n动态清单更新：\n- 二楼卫生间墙砖：累计完成10㎡，状态⏳，剩余10㎡。\n- 建渣清运：累计已拉X车。\n\n---\n\n**将此提示词复制到任意AI对话框，即可开始使用。**", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_5924386762211", "name": "涉及跃层和砸墙时调用", "taskDesc": "主题:", "versions": [{"label": "v1", "date": "导入", "prompt": "---\n主题:\n  - 打拆AI化\n摘要:\n  - 涉及跃层和砸墙的时候要调用的一个提示词的规则\n用途:\n  - 提示词\n进度:\n  - 已完成\n---\n#打拆 #打拆AI化 #打拆AI化系统 \n\n```table-of-contents\n```\n# 跃层与砸墙工作量拆解规则\n\n**使用说明**：当遇到跃层户型或需要进行砸墙拆解时，将此规则作为附件提供给 AI，要求其在生成工作量清单时严格遵循上述格式。\n\n---\n\n## 一、跃层户型拆解\n\n若房屋为跃层（含复式、别墅等），总工作量清单必须按楼层拆分为独立板块（如“一楼”、“二楼”）。\n\n### 1. 楼层结构\n- 每个楼层内，按以下功能区分别列出工作项：\n  - 全屋（仅首层列出一次）\n  - 客餐厅 + 卧室\n  - 客厅阳台\n  - 厨房（含厨房阳台）\n  - 卫生间\n  - 露台\n  - 主体结构拆改（砸墙、开洞等）\n\n### 2. 全屋类工作项\n- 吊顶、全屋杂项（门、门套、窗套、踢脚线、石膏线、飘窗石材、窗帘轨道、窗帘）等仅在一楼“全屋”板块列出一次，二楼不再重复。\n\n---\n\n## 二、砸墙工作拆解（主体结构拆改板块）\n\n砸墙类工作统一归入“主体结构拆改”板块，按楼层分别呈现。表格必须包含以下七列：\n\n| 空间 | 墙体名称 | 墙体类型 | 工程量 | 已完成 | 状态 | 备注 |\n|------|----------|---------|--------|--------|------|------|\n\n### 1. 墙体命名\n- 使用具体名称，如“厨房内墙”“卧室隔墙”“楼梯间墙体”“花架梁下墙体”等，避免仅写“砸墙”。\n\n### 2. 墙体类型\n- 标注墙厚（如24墙、12墙），若有保温层、混凝土结构等一并注明（如“24墙+2cm保温层”）。\n\n### 3. 工程量计算\n- 先计算毛面积（高×宽），再扣除门洞、窗洞。\n- 单门洞统一按 **1.6㎡** 扣除，双门洞按 **3.2㎡** 扣除，特殊情况单独说明。\n- 在备注栏写明计算过程（如“2.5×1.42=3.55㎡，减单门洞1.6㎡”）。\n\n### 4. 状态\n- 按实际进度标记：✅已完成 / ⏳进行中 / ❌未开始。\n\n---\n\n## 三、示例\n\n### 一楼主体结构拆改\n\n| 空间 | 墙体名称 | 墙体类型 | 工程量 | 已完成 | 状态 | 备注 |\n|------|----------|---------|--------|--------|------|------|\n| 厨房 | 厨房内墙 | 24墙 | 3.75㎡ | 3.75㎡ | ✅ 完成 | |\n| 厨房 | 厨房外墙 | 24墙 | 1.78㎡ | 1.78㎡ | ✅ 完成 | |\n| 一楼客卫 | 客卫与餐厅隔墙 | 24墙 | 3.75㎡ | 3.75㎡ | ✅ 完成 | |\n| 一楼客卫 | 客卫12墙（含门洞） | 12墙 | 1.95㎡ | 0 | ❌ 未开始 | 2.5×1.42=3.55㎡，减单门洞1.6㎡ |\n| 小卧室 | 小卧室与过道隔墙 | 24墙 | 1.45㎡ | 1.45㎡ | ✅ 完成 | |\n| 主卧 | 主卧24墙（门洞已除） | 24墙 | 2.5875㎡ | 0 | ❌ 未开始 | |\n| 主卧 | 主卧12墙（门洞已除） | 12墙 | 0.9㎡ | 0 | ❌ 未开始 | 2.5×1=2.5㎡，减单门洞1.6㎡ |\n| 一楼楼梯间 | 楼梯间墙体 | 24墙+2cm保温层 | 5.25㎡ | 0 | ❌ 未开始 | |\n\n### 二楼主体结构拆改\n\n| 空间 | 墙体名称 | 墙体类型 | 工程量 | 已完成 | 状态 | 备注 |\n|------|----------|---------|--------|--------|------|------|\n| 两间卧室 | 卧室隔墙 | 12墙 | 6.875㎡ | 6.875㎡ | ✅ 完成 | |\n| 二楼楼梯间 | 楼梯间墙体 | 24墙 | 7.075㎡ | 0 | ❌ 未开始 | |\n| 二楼卫生间 | 花架梁下墙体（含窗洞） | 24墙 | 7.9025㎡ | 0 | ❌ 未开始 | 2.25×4.65=10.4625㎡，减1.6×1.6窗洞2.56㎡ |\n| 混凝土楼板开洞 | — | — | 1.53×1.53m | 0 | ❌ 未开始 | |", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_9226785634140", "name": "系统设计文档VS提示词指令", "taskDesc": "主题:", "versions": [{"label": "v1", "date": "导入", "prompt": "---\n主题:\n  - 打拆AI化\n摘要:\n  - 打拆AI化系统，它的系统设计文档和提示词指令两个之间的区别\n用途:\n  - 打拆AI化\n进度:\n  - 已完成\n---\n#打拆 #打拆AI化系统 #创业 #打拆AI化 \n```table-of-contents\n```\n\n|文档|建议全名|简称|\n|---|---|---|\n|系统设计文档|**好好拆智算体·系统架构与数据规范**|V2|\n|AI 提示词指令集|**好好拆智算体·AI 自动化处理指令集**|V5|\n**说明**：\n- V2 是“蓝图”，定义表结构、字段、规则、术语。\n- V5 是“工人手册”，告诉 AI 如何按 V2 的规则处理数据并输出结果。\n\n## V2是什么\n**v2.0 目前是一份“系统设计说明书” + “数据结构定义” + “业务规则库”，并不是一个可自动运行的软件。它的用途是：\n\n|用途|说明|\n|---|---|\n|**开发蓝图**|给程序员或AI工具（如Coze、Dify）看，告诉他们要建哪些表、字段、规则。|\n|**手工操作手册**|你和工长可以按照文档中的表格、模板，手动填写Excel或纸质表单，先跑通流程。|\n|**数据标准**|规范今后每个工地要记录哪些字段，保证数据一致性，为后续自动化打基础。|\n|**沟通工具**|向合伙人、投资人、潜在买家展示你的系统化能力和业务深度。|\n\n\n## V5是什么\n目前我复盘已完结的工地，用的就是V5，其实我把施工前和施工后融合起来了，后期应该是5.1和5.2融合，也局势施工中和施工后需要融合在一起，询价是一个页面功能，施工管理（施工中和施工后复盘）是一个页面功能，数据库里面就是5张表，我可以从5张表里提取无尽的看板，数据库等于大脑里的记忆，我需要什么具体的功能，就是大脑不同的功能区来负责。\n\n接下来需要新建以下指令\n\n| 阶段  | 指令名称              | 简称                  | 基于 V2 的章节 |\n| --- | ----------------- | ------------------- | --------- |\n| 施工前 | **好好拆智算体·询价报价指令** | V5.0（5.0目前是拆解复盘）    | 第四、五章     |\n| 施工中 | **好好拆智算体·进度管理指令** | V5.1（需新建）           | 第六章       |\n| 施工后 | **好好拆智算体·复盘分析指令** | V5.2（已有，即原 V5 的第二步） | 第七章       |\n\n\n\n\n\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_8995784348967", "name": "👄询价模型-提示词", "taskDesc": "主题:", "versions": [{"label": "v1", "date": "导入", "prompt": "---\n主题:\n  - 打拆AI化\n摘要:\n  - 用来询价的提示词，比如XX平石膏板就可以得到价格\n用途:\n  - 提示词\n  - 和AI交互\n进度:\n  - 已完成\n---\n#提示词 #打拆 #打拆AI化系统 #打拆AI化 \n\n```table-of-contents\n```\n# 拆除工作项数据模型与使用说明\n\n以下是我的数据模型和你的工作规则。请按此执行。\n\n---\n\n## 一、角色定义\n\n你是拆除工作项的成本与用工预估助手。你的核心能力是：\n1. 根据用户提供的面积，预估拆除用工（工）、清运用工（工）、建渣量、车辆成本。\n2. 底层使用**分钟**作为原始工时单位，消除不同工地工时标准差异。\n3. 持续接收新工地数据，验证后更新知识库模型。\n4. 每次对话结束前，询问用户是否输出完整数据文档。\n\n---\n\n## 二、交互规则\n\n1. 用户输入“工作项名称 + 面积”时：\n   - 若用户未说明工时标准，默认按 **7.5小时/工（450分钟/工）** 计算。\n   - 若用户说明工时标准（如“8小时/工”），按该标准换算（总分钟 ÷ 工时标准分钟/工）。\n2. 输出预估时，展示**用工 X 工**（打拆 X 工，清运 X 工），但底层基于分钟计算。\n3. 用户提供新工地数据时：\n   - 请提供**分钟数**（例如：10 m² 隔墙用了 30 分钟），我会记录为“工程用时（分钟/m²）”。\n   - 先验证数据合理性（与现有模型对比）\n   - 询问用户是否更新知识库\n   - 若更新，记录数据来源，调整模型\n4. 每次对话结束前，主动询问：“是否输出当前完整的 MD 数据文档？”\n5. **吊顶拆除时**：若用户未明确吊顶类型（纯单层石膏板、复杂造型、木吊顶），需主动询问确认。\n\n---\n\n## 三、默认工况（按工作项）\n\n- 地坪拆除：强粘连（水泥基层）\n- 空鼓处理：大桶清运\n- 石膏板隔墙拆除：标准模型\n- 吊顶拆除：石膏吊顶，需用户确认造型类型\n- 混凝土拆除：暂缺清运模型，只输出打拆部分\n\n---\n\n## 四、预估输出格式（固定）\n\n> **用工**：X 个工（打拆 X 工，清运 X 工）  \n> **建渣**：约 X 方（约 X 车）  \n>   \n> 打拆人工成本：XX 元  \n> 清运人工成本：XX 元  \n> 清运车辆成本：XX 元  \n> **总成本**：XX 元（XX 元/m²）\n\n**说明**：\n- 工数 = 总分钟 ÷ 工时标准（分钟/工）。若用户未指定工时标准，默认 450 分钟/工。\n- 人工成本 = 工数 × 350 元/工。\n- 车辆成本按建渣方量及车型容量向上取整计算。\n\n---\n\n## 五、车辆成本规则\n\n- 根据建渣方量，按车型容量向上取整得到实际车数\n- 车辆成本 = 实际车数 × 该车型单价\n- 不满一车按一车算，不按比例折算\n\n---\n\n## 六、术语说明\n\n- **工程用时**：每平方米（或每根、每米等）施工内容需要多少**分钟**\n- **人员效率**：每分钟能干多少活（平方米、根、米等）\n\n---\n\n## 七、数据模型（底层单位：分钟）\n\n> 最后更新：2026-04-06  \n> 人工单价：350 元/工  \n> 默认工时标准：7.5 小时/工 = 450 分钟/工（用户可指定其他标准）  \n> 车辆成本：按车型容量向上取整，不按比例折算  \n\n### 待补充模型\n\n- 混凝土拆除：清运用工、建渣量\n- 保温层拆除：清运用工\n\n### 工作项模型\n\n#### 1. 地坪拆除\n\n**强粘连（水泥基层）**\n- 工程用时：10.575 分钟/m²（0.0235 工/m² × 450 分钟/工）\n- 人员效率：0.0946 m²/分钟\n- 参考成本（默认工时标准）：8.23 元/m²（实际随工时标准浮动）\n- 清运用工：暂无/待补充\n- 建渣量：暂无/待补充\n- 数据来源：爱这城（85 m²，2工）\n\n**弱粘连（保温板上）**\n- 工程用时：8.505 分钟/m²（0.0189 工/m² × 450）\n- 人员效率：0.1176 m²/分钟\n- 参考成本（默认）：6.62 元/m²\n- 清运用工：12.735 分钟/m²（0.0283 工/m² × 450）\n- 建渣量：106 m²/车（勾臂车7方，约0.00943车/m²）\n- 数据来源：碧云天骄（106 m²，打拆2工，清运3工，1车）\n\n#### 2. 空鼓处理\n\n**打拆**\n- 工程用时：4.725 分钟/m²（0.0105 × 450）\n- 人员效率：0.2116 m²/分钟\n- 参考成本（默认）：3.66 元/m²\n- 数据来源：温江英鹂庄园（191 m²，2工）\n\n**清运（大桶）**\n- 工程用时：7.065 分钟/m²（0.0157 × 450）\n- 人员效率：0.1415 m²/分钟\n- 参考成本（默认）：5.50 元/m²\n- 建渣量：0.00785 车/m²（约127 m²/车）\n- 数据来源：温江英鹂庄园（191 m²，3工，1.5车）\n\n#### 3. 保温层拆除\n\n**打拆**\n- 工程用时：5.76 分钟/m²（0.0128 × 450）\n- 人员效率：0.1736 m²/分钟\n- 参考成本（默认）：4.48 元/m²\n- 清运用工：暂无/待补充\n- 数据来源：案例1（39 m²，0.5工）\n\n**建渣量**\n- 单位建渣：0.077 m³/m²\n- 数据来源：案例2（26 m²，2 m³）\n\n#### 4. 混凝土拆除\n\n**柱子（240截面，高2.5m）**\n- 工程用时：121.5 分钟/根（0.27 × 450）\n- 人员效率：0.00823 根/分钟\n- 参考成本（默认）：94.5 元/根\n- 清运用工：暂无/待补充\n- 建渣量：暂无/待补充\n- 数据来源：经验值\n\n**飘窗**\n- 工程用时：121.5 分钟/米（0.27 × 450）\n- 人员效率：0.00823 米/分钟\n- 参考成本（默认）：94.5 元/米\n- 清运用工：暂无/待补充\n- 建渣量：暂无/待补充\n- 数据来源：理论值\n\n**回填挖除（厚度20cm）**\n- 工程用时：90 分钟/m²（0.2 × 450）\n- 人员效率：0.0111 m²/分钟\n- 参考成本（默认）：70 元/m²\n- 清运用工：暂无/待补充\n- 建渣量：暂无/待补充\n- 数据来源：梅花庭院（2.5 m²，0.5工）\n\n#### 5. 石膏板隔墙拆除\n\n**打拆（投影面积）**\n- 工程用时：3.0 分钟/m²（0.00667 × 450）\n- 人员效率：0.3333 m²/分钟\n- 参考成本（默认）：2.34 元/m²\n- 数据来源：天紫界12楼（10 m²隔墙，30分钟）\n\n**清运（投影面积）**\n- 工程用时：3.006 分钟/m²（0.00668 × 450）\n- 人员效率：0.3327 m²/分钟\n- 参考成本（默认）：2.34 元/m²\n- 建渣量：0.10 m³/m²（即100 m²隔墙→10方）\n- 数据来源：天紫界3楼（229.5 m²石膏板，1工+2小时）及用户指定\n\n#### 6. 吊顶拆除\n\n**木吊顶**\n- 工程用时：4.14 分钟/m²（默认0.0092 × 450），范围 3.0825–5.22 分钟/m²\n- 人员效率：0.2415 m²/分钟，范围 0.1916–0.3245 m²/分钟\n- 参考成本（默认）：3.22 元/m²\n- 清运用工：3.006 分钟/m²（0.00668 × 450）\n- 建渣量：不计（木头类由柴车免费拉走）\n- 数据来源：锦里苑（73 m²，0.5工）；芳草地（43 m²，0.5工）\n\n**石膏吊顶 - 纯单层（不含龙骨）**\n- 工程用时：3.375 分钟/m²（默认0.0075 × 450），范围 2.25–4.5 分钟/m²\n- 人员效率：0.2963 m²/分钟，范围 0.222–0.444 m²/分钟\n- 参考成本（默认）：2.63 元/m²\n- 清运用工：3.006 分钟/m²\n- 建渣量：0.0375 m³/m²（每100平约3.75方）\n- 数据来源：用户指定\n\n**石膏吊顶 - 复杂造型（双层、跌级、弧形等）**\n- 工程用时：3.375 分钟/m²（默认0.0075 × 450），范围 2.25–4.5 分钟/m²\n- 人员效率：0.2963 m²/分钟\n- 参考成本（默认）：2.63 元/m²\n- 清运用工：3.006 分钟/m²\n- 建渣量：0.05 m³/m²（每100平约5.0方）\n- 数据来源：博雅庭韵（100 m²，0.5工，建渣4-5方）\n\n### 车辆数据库\n\n**勾臂车（地下）**\n- 容量：7 方\n- 建渣单价：500 元/车\n- 杂货单价：700 元/车\n- 备注：首选，最划算\n\n**环卫车（4轮）**\n- 容量：3.5–4 方\n- 建渣单价：400 元/车\n- 杂货单价：550 元/车\n- 备注：补足剩余方量\n\n**火三轮**\n- 容量：2.2 方 或 2.86 方\n- 建渣单价：300 元/车\n- 杂货单价：450 元/车\n- 备注：少量剩余时使用\n\n### 核心概念定义\n\n**纯建渣**\n- 定义：水泥块、瓷砖、红砖、地砖、墙砖等重硬材料\n- 备注：装车慢，压实后体积小；对应车辆单价 500 元/车\n\n**杂货**\n- 定义：吊顶、木龙骨、石膏板、保温层、轻质隔断等轻质材料\n- 备注：装车快，蓬松易满车；对应车辆单价 700 元/车\n\n**柴/木头类**\n- 定义：橱柜、门、踢脚线、木地板、定制柜等木质材料\n- 备注：尺寸约 3.4m×0.7m×0.4m；通常由柴车免费拉走，不计入清运车辆成本\n\n**勾臂车**\n- 定义：常用建渣运输车型\n- 尺寸：2.016m × 3.93m × 0.8m = 6.34 m³（平箱）\n- 备注：地下室停放约 7 m³/车，地面停放约 8–9 m³/车；建渣 500 元/车，杂货 700 元/车\n\n---\n\n*本模型将持续更新，每次新数据经确认后自动迭代。*", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_1824751906720", "name": "00 企业AI化改造SOP", "taskDesc": "层级结构待补充、背景篇待完善", "versions": [{"label": "v1", "date": "导入", "prompt": "层级结构待补充、背景篇待完善\n\n\n## 背景篇（目标：快速稳定获取以下层级的背景，并创建文件夹管理）\n公司背景-业务背景-部门背景-岗位背景\n格式？模板？流程？提示词？\nCC启用——（你只需要说 /background-doc或者「帮我梳理XX背景」）\n## 背景信息收集清单\n基于背景篇内容，访谈+会议记录+1对1聊获+AI提问，补足背景信息收集清单\n\n### 实际执行流程（京享家打版）\n**第一步**：阿药提供已有资料 → Claude 读取\n**第二步**：Claude 逐模块对照清单，标覆盖状态（✅/⚠️/❌），告诉阿药缺什么\n**第三步**：Claude 对缺失模块设计具体问题，分模块逐一问阿药。阿药回答，不知道就说不知道\n**第四步**：阿药纠偏——「时间数据不需要太精确」「不要只盯着产品部，现在是企业层面收集」\n**第五步**：六个模块全部达到可用水平，Claude 输出收集成果文档到项目文件夹，进入诊断\n\n### 关键原则\n- Claude 主动问，不等阿药自己想\n- 够用即停，不追求完美\n- 不预设改造方向，收集阶段不锁定某条业务线\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_424800393735", "name": "01 什么是企业AI化改造", "taskDesc": "```table-of-contents", "versions": [{"label": "v1", "date": "导入", "prompt": "\n```table-of-contents\n```\n## 一、一句话定义\n\n**企业AI化改造，是把 AI 从「员工手里的外部工具」升级为「企业内部的系统能力」，让数据与模型驱动企业的运作和决策，实现从「流程+经验」到「数据+模型」的范式转移。**\n\n拆开看这个转变：\n\n- **工具阶段**：员工自己用 ChatGPT 写文案、用 AI 作图。AI 是个人的、零散的、不可管理的。效果取决于每个人的主动性。\n- **能力阶段**：企业的核心业务流程、知识资产、决策机制，都由 AI 驱动或增强。AI 是组织的、系统的、可复用的。效果不依赖特定人。\n\n大多数喊「我们在做企业AI化」的公司，实际还停留在工具阶段。\n\n---\n\n## 二、它不是什么（五大误区）\n\n澄清「不是什么」，比说「是什么」更能避免走弯路：\n\n| 误解 | 正解 |\n|------|------|\n| ≠ 给员工装AI工具 | 装工具是信息化思维，AI化要的是工作方式的变化，不是软件安装量的变化。 |\n| ≠ 做一个AI项目 | 项目有终点，改造没有。AI化是持续进化的组织能力，不是一次性交付的IT项目。 |\n| ≠ 用AI替代人 | AI替代的是「任务」，不是「人」。人做判断与创造，AI做重复与计算。 |\n| ≠ 技术部门的事 | 技术搭台，业务唱戏。业务不参与、不使用，改造就是空中楼阁。 |\n| ≠ 上一个AI中台 | 中台是基础设施，不是改造本身。没有业务场景驱动的中台，最后就是一套没人用的系统。 |\n\n---\n\n## 三、为什么这么难：三件事要同时补课\n\n企业AI化改造不是从零开始盖楼，而是在一栋老楼里重新布线——墙体要动、管道要换、人还要正常住在里面。\n\n**它的难度来自一个根本矛盾**：信息化、数字化、AI化是层层递进的关系，但传统企业往往三样都没做好。这就意味着不是按顺序来，而是要同时补三门课。周期长、投入大、见效慢——但也正因为难，做成之后别人抄不走，价值壁垒才高。\n\n很多传统企业自己分不清这三个概念，混在一起谈就更容易走错方向：\n\n| | 信息化 | 数字化 | AI化 |\n|---|---|---|---|\n| **核心动作** | 纸质→电子 | 流程→数据 | 经验→模型 |\n| **解决的问题** | 数据存不住、找不到 | 数据看不到、看不全 | 数据用不上、用不好 |\n| **人机关系** | 人操作软件 | 数据辅助人判断 | AI驱动/增强人 |\n| **典型产物** | ERP、OA、财务软件 | 数据看板、BI报表 | AI工作流、智能决策、知识库 |\n| **价值落脚点** | 数据有记录 | 数据有洞察 | 数据有行动 |\n| **主导者** | IT部门 | 数据+业务部门 | 业务+AI复合型人才 |\n| **核心瓶颈** | 技术实现 | 数据打通 | 知识结构化 + 组织变革 |\n\n**关键结论**：\n\n- 信息化是数字化的前提——流程没上线、数据没存下来，数字化无从谈起。\n- 数字化是AI化的前提——数据散在各处、没有打通，AI喂不进有效信息。\n- **传统企业的现实是**：三样都没做好。所以企业AI化改造往往要同时补信息化的课、做数字化的活、推AI化的应用——这是它难的根本原因。\n\n---\n\n## 四、核心本质：两个层面的根本转变\n\n企业AI化改造同时改变两件事：\n\n### 1. 运作方式：从「流程驱动」到「数据驱动」\n\n- **改造前**：业务按固定流程机械流转，人去触发、跟进、审批。流程是预设的、僵化的。\n- **改造后**：实时数据触发AI动态调度和响应。流程不再是固定的，而是根据上下文自适应生成。\n\n### 2. 决策方式：从「经验驱动」到「模型驱动」\n\n- **改造前**：关键决策依赖少数人的直觉、经验和拍脑袋。结果不可复盘，能力无法复制。\n- **改造后**：决策基于历史数据和AI模型的概率输出。可量化、可复盘、可进化。\n\n> **一句话**：以前是「按流程办事、凭经验决策」；以后是「数据驱动运作、模型辅助决策」。\n\n---\n\n## 五、两个阶段\n\n企业AI化改造不是一步到位的，分为两个阶段：\n\n- **第一阶段：业务升级**（L1→L3）。在不改变现有商业模式的前提下，用AI提升效率、优化决策、沉淀知识。本质是让现有生意跑得更快、更准、更省。\n- **第二阶段：模式创新**（L4）。AI催生新产品、新服务、新商业模式。企业从「卖产品/服务」升级为「卖数据/模型能力」。\n\n**大多数企业只需要、也只应该关注第一阶段。** 第二阶段不是规划出来的，是第一阶段做到位之后自然浮现的。\n\n---\n\n## 六、成熟度模型（L0-L4）\n\n| 级别     | 名称    | 典型特征                                  | 核心变化 | 所属阶段 |\n| ------ | ----- | ------------------------------------- | ---- | ---- |\n| **L0** | 无AI   | 没人用AI工具，或只有老板在喊口号                     | /    | /    |\n| **L1** | 个人工具  | 个别员工自己用ChatGPT/Kimi/豆包，公司不知情或未组织      | 点状提效 | 第一阶段 |\n| **L2** | 团队工作流 | 某条业务线的某个环节AI化了，有SOP，效果可量化             | 流程再造 | 第一阶段 |\n| **L3** | 组织系统  | AI嵌入多条业务线，知识库+数据管道就位，关键决策由AI辅助，不依赖特定人 | 决策升级 | 第一阶段 |\n| **L4** | AI原生  | AI驱动商业模式，产品/服务因AI具备代际优势，数据资产创造新收入流    | 模式创新 | 第二阶段 |\n\n**典型卡点**：\n\n- 大部分企业卡在 **L1→L2**。原因不是技术，是没有人把「个人使用」翻译成「组织行为」。\n- **L2→L3** 是最难的一跃。需要基础设施（知识库、数据管道）到位，需要老板、中层、执行层三方对齐。\n- L4 不是规划出来的，是 L1-L3 做到位之后自然浮现的。\n\n---\n\n## 七、怎么推进：路线图 + 施工图\n\n企业AI化改造需要两套图纸配合：\n\n### 7.1 路线图（纵向节奏——先做什么、后做什么）\n\n告诉你方向和阶段，对应成熟度逐级推进：\n\n```\n点状提效（L1） → 流程再造（L2） → 决策升级（L3） → 模式创新（L4）\n```\n\n1. **点状提效**：员工自发用AI工具辅助单点任务。不求系统，先让一部分人用起来。\n2. **流程再造**：把AI嵌入某条业务线的固定环节。从一个节点跑通，形成SOP。\n3. **决策升级**：AI参与核心高频决策，知识库和数据管道成为组织基础设施。\n4. **模式创新**：AI催生新商业模式。这是前三个阶段做到位之后自然浮现的。\n\n### 7.2 施工图（横向拆解——同一时间从哪些方面下手）\n\n告诉你具体要改什么。在路线图的每个阶段，都要从四个维度同时发力：\n\n| 维度 | 核心问题 | 改到什么程度算改成了 |\n|------|----------|---------------------|\n| **流程AI化** | 业务流里哪些环节人在做「翻译」工作？（A格式→B格式，原始输入→结构化输出） | 该环节从「人执行+人决策」变成「AI执行，人审核/确认」 |\n| **知识AI化** | 公司的知识资产存在哪？新人靠谁教？老人离职带走什么？ | 任何人问「关于XX我应该知道什么」，AI能从知识库调出准确答案 |\n| **决策AI化** | 哪些决策因为信息不全/分析不够，只能凭感觉？ | 做决策时人会习惯性地先看AI分析结果，即使不同意也有据可查 |\n| **组织能力AI化** | 如果最懂AI的人明天离职，公司的AI能力还剩多少？ | 新员工入职含AI培训，各岗位有AI工作SOP，使用数据进入管理视野 |\n\n### 7.3 路线图 × 施工图的配合\n\n```\n                    流程AI化  知识AI化  决策AI化  组织能力AI化\n点状提效（L1）        ○         ○         ✕         ○（萌芽）\n流程再造（L2）        ●         ●         ○         ○\n决策升级（L3）        ●         ●         ●         ●（系统化）\n模式创新（L4）      四个维度全部成熟，商业模式自然创新\n```\n\n> **路线图**告诉你方向和阶段，**施工图**告诉你具体要改哪些部分。两者结合：按路线图的节奏，用施工图的维度，逐级推进。第一阶段（L1-L3）重点在四个维度的内部升级；第二阶段（L4）自然走向模式创新。\n\n---\n\n## 八、对企业不同角色的意义\n\n### 对公司\n\n从「人治」走向「数治」，从「经验传承」走向「模型进化」。\n\n不再是一个靠堆人、靠传帮带运转的「人合组织」，而是一个数据与模型持续进化的「数字生命体」。核心资产不再是那几个老师傅的经验，而是可沉淀、可迭代、可规模化复用的数据资产和AI能力。\n\n公司具备了**抗脆弱性**——关键人员离职不会瘫痪业务；同时具备了**规模化的边际成本递减效应**——每增加一笔业务，模型就更聪明，而不是更累。\n\n### 对老板\n\n不是买一套软件，而是一场**组织变革**。需要重新设计业务流程、岗位定义、人才结构、甚至考核方式——从考核「做了多少事」到考核「对AI输出的判断和决策质量」。\n\n最终目标：把个人经验变成公司数字资产，降低对关键人的依赖，让企业越用越聪明。\n\n### 对员工\n\n不是怕被AI取代，而是学会与**AI协作**。你的价值不再是「做得快」，而是：\n- **问对问题**——知道让AI做什么、怎么描述需求\n- **做AI不擅长的判断**——同理心、价值权衡、例外处理\n- **监督和解释AI的行为**——AI出错了你知道为什么、怎么修\n\nAI干脏活累活，你专注创造性、人情味、例外管理。\n\n---\n\n> 📌 本文档聚焦「是什么」和「为什么要这样做」。具体怎么执行（诊断三张地图、六阶段方法论），见「如何做企业AI化改造」文档。\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_4764561774725", "name": "02 如何做企业AI化改造", "taskDesc": "```table-of-contents", "versions": [{"label": "v1", "date": "导入", "prompt": "\n```table-of-contents\n```\n# 如何做企业AI化改造\n\n> 2026-05-12 阿药 + Claude Code。对应「什么是企业AI化改造」文档的执行层，解决「知道了是什么，具体怎么做」的问题。\n\n---\n\n## 五阶段总览\n\n```\n阶段0：摸底        →  收集背景信息，快速过三个硬条件\n阶段1：诊断与对齐   →  画三张地图 × 老板的想法，碰撞出改造路线图\n阶段2：试点打版     →  跑通一个节点，拿到可量化数据\n阶段3：基建        →  知识库/数据管道/工具链，让改造可复制\n阶段4：规模化       →  从一条线复制到多条线\n阶段5：进化        →  AI-native 产品或商业模式浮现\n```\n\n---\n\n## 阶段0：摸底——快速判断 + 背景收集\n\n别人来找你做AI化改造，本身就是「适合做」的信号。阶段0不需要长篇论证，做两件事：\n\n**第一件事：过三个硬条件。** 这是防止接错案子的底线检查。\n\n| 条件 | 合格线 | 不合格怎么办 |\n|------|--------|-------------|\n| **业务有可结构化的知识/流程** | 核心业务流程能画得出来 | 先做信息化补课，流程文档化之后再启动 |\n| **老板有认知或至少不反对** | 愿意花钱/花时间尝试，不是完全不投入 | 用L1个人工具阶段先证明效果，拿到正反馈再扩大 |\n| **有至少一个痛点足够痛** | 有明确的「不改不行」的环节 | 等痛点出现，或换一家 |\n\n如果一家企业流程文档为零、数据全在微信聊天记录里、老板觉得「AI就是ChatGPT写写文案」——改造的起点不是AI，是先把信息化拉上来。\n\n**第二件事：按背景信息收集清单收信息。** 够用即停，不追求逐项填满。你在京享家已经知道的（业务流、痛点），不用为了填表而填表。清单的作用是防止遗漏「缺了会出事」的信息——比如信息化现状（决定了基建工作量）和人的情况（决定了能不能推下去）。\n\n### 收集技巧一：智能资料优先\n\n不要一上来就丢清单让人填。先判断行业类型，要最可能暴露真实工作流的材料：\n\n| 判断维度 | 意味着什么 | 优先要什么 |\n|---------|-----------|-----------|\n| **卖什么的**（产品/服务/方案） | 工作流形态不同 | 产品→SKU表和报价流程；服务→客户沟通记录；方案→历史方案和修改痕迹 |\n| **客户是谁**（B端/C端/G端） | 决策链和信息源不同 | B端→合同和商务流程；C端→客服记录和转化数据 |\n| **规模多大**（几人/几十人/几百人） | 流程正式化程度不同 | 小团队→创始人自述和聊天记录；大公司→OA流程和部门交接文档 |\n\n逻辑：很多人说不清自己的工作流。但你问他「上次做的报价表给我看一下」，那张表本身就会暴露流程——用了什么字段、改过哪里、谁审核过。材料比描述更真实。\n\n每次做完一个行业，把这个行业的优先材料清单归档。做5个行业就有5套模板。\n\n### 收集技巧二：追问颗粒度\n\n痛点清单容易停留在「做方案很慢」这种模糊层。往下拆到「输入→处理→输出」：\n\n```\n模糊层：「做方案很慢」\n    ↓ 追问\n第一层：「方案包含什么？报价、效果图、方案书。哪个最慢？」\n    ↓ 追问\n第二层：「报价这一步，你需要什么信息才能开始做？从哪取？」\n    ↓ 追问\n第三层：「取到信息之后你做什么操作？是复制粘贴还是手动算？」\n    ↓\n颗粒度到位：「CAD测图→Excel算量→人工翻SKU找匹配→手写报价→发给销售审核」\n```\n\n只有拆到这一步，才能判断AI是接入「翻SKU匹配」还是「生成报价表」还是两个都要。追问时不要问「你觉得AI能帮什么」，只问「这一步你怎么做的、从哪取信息、做完交给谁」。\n\n**输出**：背景信息收集成果文档 + 硬条件过检结论。\n\n---\n\n## 阶段1：诊断与对齐——画地图 × 老板碰撞\n\n阶段0给你信息，阶段1用这些信息画出三张地图。但画地图不是目的，跟老板碰撞出真正的改造顺序才是目的。\n\n改造方向来自三个输入的碰撞：\n\n```\n你的诊断地图（三张图 + 热力图）\n        ×\n老板自己的想法（他想改哪、他最痛什么）\n        ↓\n      碰撞\n        ↓\n   真正的改造顺序（= 策略）\n```\n\n不是你说服他，也不是他压你。是你带一张地图，他带他的直觉，双方在地图上指指点点、讨价还价。\n\n### 1.1 你的准备：画三张地图\n\n在见老板之前，先独立完成诊断。用阶段0收集的背景信息。\n\n### 第一张：价值流地图\n\n把企业的核心业务从头到尾画出来。每条业务线一张图。\n\n```\n示例：房产礼包业务\n\n市场开发 → 意向确认 → 需求对接 → 方案报价 → 商务谈判 → 签约 → 交付\n```\n\n每个节点问三个问题：\n1. **谁在做？**（哪个岗位、具体哪个人）\n2. **怎么做？**（依赖经验判断还是固定规则？）\n3. **卡在哪？**（最慢、最容易出错、最依赖特定人的环节是哪个？）\n\n**输出**：一张标注了「卡点」的完整业务流图。\n\n### 第二张：数据/知识地图\n\n对应价值流上的每个节点，盘点需要什么信息来做决策：\n\n| 节点 | 需要什么信息 | 现在存在哪 | 能不能结构化 |\n|------|-------------|-----------|-------------|\n| 方案报价 | 户型图、物料库、价格表 | 人脑+Excel | ✅ 可以 |\n| 意向确认 | 项目背景、决策人信息 | 销售自己记 | ⚠️ 部分可以 |\n| 商务谈判 | 竞品信息、客户偏好 | 经验/直觉 | ❌ 难 |\n\n**输出**：一张标注了「数据就绪度」的信息资产图。\n\n### 第三张：AI介入热力图\n\n对价值流上的每个节点打分（1-5分）：\n\n| 评分维度 | 1分 | 3分 | 5分 |\n|---------|-----|-----|-----|\n| **频率** | 偶尔发生 | 每周几次 | 每天多次 |\n| **规则性** | 纯创意/关系型 | 有套路但需灵活 | 规则明确、可标准化 |\n| **数据可得性** | 没有数据 | 有但散落 | 结构化、可直接用 |\n| **效果可量化** | 说不清 | 大致能算 | 精确可测算 |\n\n**总分16分以上的节点优先改造。**\n\n**输出**：一张价值流×AI可行性的打分热力图，标注优先改造节点。\n\n---\n\n### 1.2 碰撞：诊断 × 老板想法 = 路线图\n\n带着你的三张地图去见老板，问：\n\n> 「你看，这是咱们完整业务流，这些是我标的高分节点（指热力图）。你最想先改哪里？」\n\n三个常见情况：\n\n**情况一：他说的跟你算的对上了。** 他说改礼包方案，你热力图礼包方案17分最高。对齐了，直接推进。这是最理想的情况。\n\n**情况二：他说的跟你算的不一样。** 他说改A环节，你的热力图A只有8分。你不要说「老板你错了」，而是说：「A数据可得性只有1分，现在改的话，AI喂不进去，效果出不来。隔壁B是17分，两个月就能见效。我们先把B跑了，拿B的结果回来再推A。」\n\n**情况三：你发现了他没看到的角度。** 他盯着礼包方案，但你发现线索评分虽然数据分低，但配合度高、出结果快。主动建议：「礼包方案要做，但先花两周搞线索评分，马上能见效果，拿这个效果回去跟他汇报，他更有信心投礼包方案。」\n\n### 1.3 定目标\n\n碰撞完方向确认了，把目标翻译成数字：\n\n| 指标类型 | 例子 | 怎么算 |\n|---------|------|--------|\n| **效率** | 出方案时间从X小时→Y小时 | 改造前后计时对比 |\n| **质量** | 错误率/返工率下降Z% | 统计数据 |\n| **覆盖** | N人真正在日常工作中使用 | 使用频率统计 |\n| **成本** | 单任务人力成本降低M% | 人力时薪×节省时间 |\n\n目标必须具体到数字。没有数字 = 没有办法判断改没改成。\n\n### 1.4 诊断的价值（复盘）\n\n诊断地图的作用不是算出最优解，是提供一张**双方都能指指点点、讨价还价的共同地图**。它做三件事：\n\n1. **把老板的直觉翻译成可讨论的东西**——他说改哪，你能拿出数据来对\n2. **防止老板拍脑袋选错**——他想改的环节分太低，你有依据说服他换\n3. **给他看他没看到的角度**——你能发现他视野之外的更高分节点\n\n**输出**：双方都认的改造路线图（选哪条线、哪个节点、目标数字、时间节点）。\n\n---\n\n## 阶段2：试点打版——跑通最小闭环\n\n试点不是测一个AI工具，是跑通一个节点的完整最小闭环：\n\n```\n试点 = 工作流梳理 + 最小数据底座 + AI方案\n       （这个环节       （这个节点跑       （替代重复劳动\n        怎么跑的）       起来需要的          + 辅助决策判断）\n                       几张表和知识库）\n```\n\n三个组件缺一不可——缺数据底座AI是空的，缺工作流理解AI改不到点上。\n\n### 打版闭环\n\n```\n梳理完整工作流\n      ↓\n设计最小数据底座（这个节点跑起来需要什么数据/知识）\n      ↓\n设计AI方案（工具 + 提示词/SOP + 数据接入）\n      ↓\n灰度测试（2-3人先开始用）\n      ↓\n量化效果（改造前后对比数据）\n      ↓\n形成可复制模板\n```\n\n### 试点三个组件\n\n**1. 工作流梳理**\n\n画这个节点的完整工作流，每个步骤「谁在做、怎么做、花多久」。\n\n**2. 最小数据底座**\n\n问：「这个节点跑起来需要什么数据？」以这个节点为圆心，建刚好够用的那几张表和知识库。\n\n比如礼包方案试点 → 只需要楼盘库 + 对应SKU销售数据 + 历史方案库。不需要全公司的数据中台。\n\n设计原则：跟着工作流走，不是反过来。范围只够这一个节点。\n\n**3. AI方案**\n\n- **工具**：用什么？（AI模型/平台/自建工具/企微机器人/工作台）\n- **提示词/SOP**：怎么用？（标准化操作流程，确保换个不太懂AI的人也能照着做）\n- **数据接入**：接入第2步建的最小数据底座\n\n### 灰度测试期间盯什么\n\n- 实际使用频率（用了没？每天用几次？）\n- 使用障碍（哪里卡住了？为什么不愿意用？）\n- 输出质量（AI产出的东西能不能直接用？要改多少？）\n- 时间对比（改造前后同一个任务花多少时间）\n\n### 打版失败的四个最常见原因\n\n1. **选了太复杂的节点**：一口吃不成胖子。先选最简单的，跑通再扩展。\n2. **没量化效果**：说不清改之前什么样、改之后什么样。没有数据，老板不会继续投入。\n3. **没人持续跟**：改造完了没人用，过两周回到老样子。需要有人持续盯、持续优化。\n4. **设计时没考虑使用者**：做出来的工具只有你自己会用。设计时问自己：「一个不太懂AI的同事，能不能在5分钟内上手？」\n\n**输出**：一个可用的AI工作流 + 一份效果数据报告 + 一份可复制的SOP模板。\n\n---\n\n## 阶段3：基础设施建设——从单点到组织级\n\n试点跑通后，**从最小数据底座扩成多条线可复用的组织级基础设施**。最大的坑是跳过这一步直接试图规模化。\n\n### 三样基础设施\n\n**1. 知识库**\n\n把散落在人脑、文档、聊天记录里的知识，变成结构化的、AI可调用的。\n\n要建哪些库：\n- 产品知识库（SKU、规格、价格、适用场景）\n- 案例库（客户、需求、方案、效果）\n- FAQ库（常见问题、标准回答）\n- 行业知识库（政策、竞品、市场动态）\n\n技术路线：向量数据库 + RAG（检索增强生成），支持自然语言查询。\n\n**2. 数据管道**\n\n业务过程的数据从「事后补录」变成「过程自动采集」。\n\n三个环节：\n- 采集：业务过程中自动沉淀数据（不是另起一套让员工填）\n- 清洗：去重、补全、标准化\n- 可调用：AI和人都能方便地取用\n\n传统企业这一步最弱——往往连基础数据都没结构化，全在Excel和人脑里。\n\n**3. AI工具链**\n\n不是每个人用各自找的AI工具，而是组织级的AI平台。\n\n三个要素：\n- 统一入口（企微机器人 / 内部工作台 / 低代码平台）\n- 权限管理（谁能用什么模型、能看什么数据）\n- 使用监控（谁在用、用在哪、效果如何）\n\n### 为什么这一步不可跳过？\n\n单点打版证明了「AI有用」。但如果：\n- 没有知识库 → 换一条业务线就要重新喂数据\n- 没有数据管道 → 每次都要手动整理数据\n- 没有工具链 → 换一个人就不会用了\n\n基建就是把「个人能力」变成「组织能力」。不建基建，改造永远依赖推动者本人。\n\n**输出**：至少一个可用的知识库 + 一条自动化的数据管道 + 一个统一的AI工具入口。\n\n---\n\n## 阶段4：规模化——从1到N\n\n基础设施建设到位后，规模化才可能发生。\n\n### 两个扩展方向\n\n**横向复制**：同类型业务线复用模板\n- 一条销售线的AI线索评分跑通 → 复制到其他销售线\n- 一个品类的AI报价跑通 → 复制到其他品类\n- 一个部门的AI培训跑通 → 推广到全公司\n\n**纵向延伸**：从执行层延伸到决策层\n- 执行层：AI帮人做事（替代重复劳动）——最容易入手、效果最可见\n- 决策层：AI帮人判断（辅助决策）——需要执行层的数据积累作为前提\n- 知识层：AI帮人学习（新人快速上手）——需要知识库基础设施到位\n\n### 规模化的信号\n\n什么时候可以开始规模化？\n- 试点业务线的效果数据稳定（至少跑了一个月）\n- 基础设施至少有一个库能用\n- 至少有一个非你的人在日常使用AI工具\n- 有另一个业务线主动说「我们也要」\n\n如果没人主动说「我们也要」，大概率是试点效果不够明显，或者只证明了「你很厉害」而非「AI很厉害」。\n\n**输出**：多条AI化的业务线 + 一份规模化复盘文档（哪些能复用、哪些要重新设计）。\n\n---\n\n## 阶段5：进化——商业模式浮现\n\n当多条业务线都AI化后，可能会出现「原来我们还能这样赚钱」的东西：\n\n- 内部用的AI能力 → 对外包装成服务卖给同行\n- 积累的独特行业数据 → 变成数据产品\n- AI+人工的混合服务 → 变成标准化SaaS产品\n- 改造经验本身 → 变成咨询服务\n\n这一步不是规划出来的，是前面五个阶段做到位之后自然浮现的。在阶段0就规划阶段6要做什么产品，是本末倒置。\n\n**输出**：新的AI-native产品或服务，或新的收入来源。\n\n---\n\n## 方法论总结\n\n| 阶段 | 核心动作 | 产出物 | 常见陷阱 |\n|------|---------|--------|---------|\n| 0. 摸底 | 过三个硬条件 + 背景信息收集 | 背景收集成果 + 过检结论 | 追求完美、逐项填满才肯往前走 |\n| 1. 诊断与对齐 | 画三张地图 × 老板碰撞 | 双方都认的改造路线图 | 闭门做诊断不找老板、目标太虚、选错线 |\n| 2. 试点 | 跑通一个节点的完整最小闭环（工作流+数据底座+AI） | 可用AI工作流+最小数据底座+效果数据 | 脱离数据底座只测工具、选太复杂节点、没量化、没人跟 |\n| 3. 基建 | 从最小数据底座扩成组织级基础设施 | 多条线可复用的知识库/数据管道/工具链 | 跳过基建试图规模化 |\n| 4. 规模化 | 横向复制+纵向延伸 | 多条AI化的业务线 | 基建不牢就扩张 |\n| 5. 进化 | 让商业模式自然浮现 | AI-native产品/服务 | 过早规划、舍本逐末 |\n\n---\n\n> 📌 本文档是执行方法论。前置阅读：「什么是企业AI化改造」。配套工具：「背景信息收集清单」。实操记录：「AI化改造SOP」。\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_3966392999912", "name": "品牌战略与策略", "taskDesc": "- **品牌战略** = 选择题（我们做什么？不做什么？）", "versions": [{"label": "v1", "date": "导入", "prompt": "## 一句话区分\n\n- **品牌战略** = 选择题（我们做什么？不做什么？）\n- **品牌策略** = 执行题（具体怎么做？用什么方法？）\n\n## 完整的逻辑链条\n```\n品牌战略（选择题）\n   ├─ 目标客户：选择服务谁（例如：有去化压力的刚需盘开发商）\n   ├─ 竞争战场：选择解决什么任务（例如：去化，而不是卖礼包）\n   └─ 切入节奏：选择先打哪里、后打哪里\n        ↓ 战略决定方向\n品牌策略（落地题）\n   ├─ 品牌定位：一句话说清“我们是谁”\n   ├─ 品牌价值主张：展开说“我们提供什么、帮客户完成什么任务”\n   ├─ 品牌价值体系：价值主张的拆解（例如：B端价值=去化伙伴；C端价值=锦上添花的礼包；信任理由=利益绑定、响应速度、京东背书）\n   ├─ 品牌价值点：可感知的具体利益点（例如：家具同等品质省30%、2小时出方案、卖不掉不收钱）\n   └─ 部门行动指引：每个部门做什么/不做什么\n        ↓ 策略指导执行\n品牌总纲（一页纸汇总）\n   └─ 包含上述所有内容，给全员看的作战地图\n```\n\n---\n### 品牌战略\n**回答三个问题**：\n1. 我们要服务谁？（选哪个客户群体）\n2. 我们在哪个战场竞争？（解决什么任务）\n3. 我们以什么节奏打？（先打哪里，后打哪里）\n\n**特点**：不对外说，只对内做决策。一年定一次，不会天天变。\n\n**京享家例子**：\n- 服务：有去化压力、愿意试新促销的开发商（优先刚需盘）\n- 战场：从“礼包促销”升级到“去化解决方案”\n- 节奏：先找1-2个中小楼盘做免费试点，出数据再复制\n\n---\n\n### 品牌策略（你现在问的）\n**回答三个问题**：\n1. 怎么让客户知道我们？（传播渠道、内容、话术）\n2. 怎么让客户相信我们？（信任建立的具体动作）\n3. 怎么让客户选择我们？（比竞品多做什么）\n\n**特点**：对外执行，可以按季度调整。是战略的具体化。\n\n1. **传播策略**：对开发商说什么？在哪说？（比如：行业峰会、一对一销售、案例白皮书）\n2. **信任策略**：怎么让开发商愿意试？（比如：免费试用一套、效果对赌、老客户证言）\n3. **竞争策略**：比竞品多做什么？（比如：2小时出方案、主动同步进度、全程促销培训）\n\n**京享家可以这样写（草稿）**：\n- **传播策略**：不再宣传“3万买10万”，重点传播“家具同品质省30%”+“卖不掉不收钱”\n- **信任策略**：对意向开发商提供“免费试一套”的承诺，用事实说服\n- **竞争策略**：比竞品多做“主动同步进度、2小时出方案、全程促销支持”/“24小时出方案+每周主动同步去化数据+驻场促销培训”\n---\n\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_4618793351048", "name": "背景信息收集清单", "taskDesc": "```table-of-contents", "versions": [{"label": "v1", "date": "导入", "prompt": "\n```table-of-contents\n```\n# 企业AI化改造：背景信息收集清单\n\n> 2026-05-12 阿药 + Claude Code。用于企业AI化改造项目启动前，系统性收集企业背景信息。对应方法论阶段0（判断）和阶段1（诊断）。\n\n---\n\n## 一、企业基本面\n\n行业定位、规模、架构，判断改造的复杂度和切入点。\n\n| 要了解的 | 为什么重要 |\n|---------|-----------|\n| 行业/赛道 | 决定参照系（同行做到什么程度了） |\n| 规模（人数、营收、覆盖城市） | 决定改造的复杂度和节奏 |\n| 组织架构 | 知道谁是决策者、谁是执行者、谁是需说服的人 |\n| 核心业务线及收入占比 | 哪条线值得优先改（主营业务优先） |\n| 企业所处阶段（初创/增长/成熟/转型） | 决定改造的紧迫度和资源空间 |\n\n---\n\n## 二、业务流全景\n\n每条业务线从头到尾怎么跑的，画价值流地图的原材料。\n\n| 要了解的 | 为什么重要 |\n|---------|-----------|\n| 每条业务线从头到尾的完整流程 | 画价值流地图 |\n| 每个环节「谁在做、怎么做」 | 判断是规则型还是经验型 |\n| 公认的卡点/瓶颈在哪 | 最痛的地方=改造切入点 |\n| 跨部门协作的断点在哪 | 信息流改造的切入点 |\n| 哪些环节是「只有某个人能做」 | 关键人依赖风险=AI化的高价值点 |\n\n---\n\n## 三、信息化/数字化现状\n\n判断起跑线在哪。这决定了基建补课的工作量。\n\n| 要了解的 | 为什么重要 |\n|---------|-----------|\n| 现在用哪些系统（ERP/OA/CRM等） | 判断信息化基础，知道数据在哪 |\n| 哪些流程还在靠 Excel/微信/人脑 | AI化改造的起点有多低 |\n| 数据有没有打通？散在哪些地方 | 数字化程度，决定基建工作量 |\n| 有没有 IT/数据团队 | 有没有人能配合技术落地 |\n| 系统是谁建的/谁在维护 | 外部采购还是自研，集成难度不同 |\n\n---\n\n## 四、数据/知识资产\n\nAI的燃料够不够、在哪、什么形态。\n\n| 要了解的 | 为什么重要 |\n|---------|-----------|\n| 产品/服务信息有没有结构化 | 知识库建设的工作量预估 |\n| 客户案例/项目经验怎么存储 | 能不能直接喂给AI |\n| 有没有历史业务数据（成交/转化/成本） | 决策AI化的燃料够不够 |\n| 新人上手靠什么（文档？师傅带？） | 知识AI化的迫切程度 |\n| 核心骨干离职会带走什么 | 哪些知识必须结构化 |\n\n---\n\n## 五、人的情况\n\n改造是人的事，不是技术的事。\n\n| 要了解的 | 为什么重要 |\n|---------|-----------|\n| 老板对AI的真实态度和期望 | 决定资源投入和容忍度 |\n| 中层/业务负责人的配合意愿 | 没人配合，改不动 |\n| 员工目前的AI使用水平和意愿 | 决定L1的基础和培训起点 |\n| 有没有内部「AI champion」 | 除了你之外还有谁能推动 |\n| 公司决策机制（老板一人说了算还是集体决策） | 决定推动策略和汇报方式 |\n\n---\n\n## 六、痛点×频率清单\n\n这是最重要的一张收集表。逐一跟业务负责人聊，把每个岗位的日常动作拆出来，不要问「你觉得AI能帮什么」，而是问「你的一天是怎么过的」。\n\n| 岗位 | 高频重复动作 | 每天花多久 | 最让人烦躁的点 | AI能不能帮 |\n|------|------------|-----------|--------------|-----------|\n| | | | | |\n| | | | | |\n| | | | | |\n\n---\n\n## 收集方式\n\n不是发问卷。三个渠道：\n\n1. **跟业务负责人一对一聊**（最重要）——问「你的一天是怎么过的，什么最花时间、什么最烦」，不问「你觉得AI能帮什么」\n2. **旁听部门例会**——看大家在讨论什么、卡在什么问题上\n3. **翻现有文档和系统**——有什么现成的流程文档、数据报表、历史记录\n\n---\n\n## 收集完之后做什么\n\n1. 画出三张诊断地图（价值流地图、数据/知识地图、AI介入热力图）\n2. 对照「什么是企业AI化改造」文档的成熟度模型，判断企业当前处于 L0-L4 哪一级\n3. 进入阶段2（策略）：选定试点业务线，定量化目标\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_6202975745004", "name": "背景篇-文档生成方法论", "taskDesc": "> 如何从零产出一份「不同人从中分拣不同信息」的组织背景通识文档。", "versions": [{"label": "v1", "date": "导入", "prompt": "# 背景文档生成方法论\n\n> 如何从零产出一份「不同人从中分拣不同信息」的组织背景通识文档。\n> 基于京享家公司背景通识的完整制作过程提炼。\n\n---\n\n## 核心原则\n\n1. **大全版本思维**：先做最完整的版本，再从里面裁剪出不同受众版本。不要一开始就试图写给特定人群。\n2. **信息分层**：公司→业务→部门，三层递进。上层是下层的上下文，下层是上层的展开。\n3. **中立客观**：只陈述事实，不出现「探索线」「没什么水花」「快被砍了」这类判断性语言。判断留给读者自己做。\n\n---\n\n## 第一步：信息收集\n\n### 1.1 资料来源清单\n\n按优先级排列：\n\n| 优先级 | 来源 | 获取方式 | 作用 |\n|--------|------|----------|------|\n| 🔴 必须 | 公司官方PDF/手册/画册 | 提取文本 | 基本信息、背书、产品描述 |\n| 🔴 必须 | 业务负责人访谈/会议纪要 | 录音转录+结构化 | 业务流程、痛点、真实做法 |\n| 🟡 重要 | 内部复盘档案/月报 | 数据提取 | 关键指标、趋势、风险点 |\n| 🟡 重要 | 组织架构/岗位说明 | 书面或口述 | 分工、汇报关系 |\n| 🟢 补充 | 竞品资料/行业报告 | 网络搜索 | 市场定位、差异化 |\n\n### 1.2 信息提取提示词\n\n```\n你正在为[组织名称]创建一份全面的背景文档。请从以下资料中提取所有事实性信息。\n\n## 提取维度\n\n对于每条信息，标注它属于哪个维度：\n- 基本信息：全称、定位、成立时间、地点、资质\n- 业务/产品：卖什么、卖给谁、解决什么问题、怎么赚钱\n- 客户/用户：谁买单、谁决策、谁使用\n- 组织架构：部门设置、汇报关系、关键角色\n- 业务流程：从开始到结束的完整步骤、各环节负责人\n- 供应链/资源：上游是谁、核心资产是什么\n- 数据指标：营收、客户数、覆盖率等可量化信息\n- 竞争环境：竞品是谁、差异化在哪里\n\n## 输出格式\n\n对每条信息：\n- 原文引用：[引用原文]\n- 归属维度：[维度名称]\n- 可信度：[高/中/低]（官方文档=高，口述=中，推测=低）\n\n## 特别注意\n- 区分「事实」和「判断」：原文说\"探索线\"是判断不是事实\n- 识别缺失：如果某个维度完全没有信息，标注出来\n- 标记矛盾：同一件事不同来源说法不一致的，标注出来\n```\n\n---\n\n## 第二步：文档结构生成\n\n### 2.1 通用结构模板\n\n```markdown\n# [组织名称]背景通识\n\n> **用途**：[一句话说明这份文档给谁看、怎么用]\n> **最后更新**：[日期]\n> **信息来源**：[列出原始资料]\n\n---\n\n# 一、组织概述\n\n## 1.1 基本信息\n| 维度 | 内容 |\n|------|------|\n| 全称 | |\n| 定位 | |\n| 成立 | |\n| 地点/覆盖 | |\n| 资质/背书 | |\n\n## 1.2 商业模式\n一句话说清楚 + 发家逻辑（怎么起家的→怎么延伸的）\n\n## 1.3 发展历程\n按年份的关键事件表\n\n## 1.4 背书/资质体系\n| 背书方 | 授权内容 | 实际价值 |\n\n---\n\n# 二、业务/产品体系\n\n## 2.1 总览\n所有业务线一览表，标注主次关系\n\n## 2.2 核心业务详解\n每个业务按四个维度展开：\n- **货品是什么**：具体产品/服务形态\n- **卖给谁**：付费方、决策方、使用方分开\n- **解决了谁的什么问题**：一句话说清楚核心价值\n- **为什么选我们**：竞争优势（不要写成宣传文案，写事实）\n\n---\n\n# 三、组织架构与分工\n\n## 3.1 整体架构（树状图）\n## 3.2 各部门职责简述\n\n---\n\n# 四、业务流程\n\n## 4.1 主业务流程（阶段+负责方+产出物）\n## 4.2 关键控制点/风险点\n\n---\n\n# 五、供应链/资源（如有）\n\n---\n\n# 六、关键数据\n\n---\n\n# 七、行业与竞争\n\n---\n\n> **更新日志**\n```\n\n### 2.2 针对不同层级的变体\n\n| 层级 | 结构变化 | 示例 |\n|------|----------|------|\n| **公司背景** | 完整结构，侧重「组织是什么」 | 京享家公司背景通识 |\n| **业务背景** | 从二、业务体系展开，公司概述压缩为背景，侧重「这条业务线怎么运作」 | 房产业务复盘档案 |\n| **部门背景** | 从三、组织架构+四、业务流程展开，侧重「谁做什么、怎么协作」 | 房产业务流程SOP |\n\n---\n\n## 第三步：迭代修正协议\n\n### 3.1 必须与真人校验的清单\n\n以下类型的信息，AI自己判断的出错率最高，必须逐条确认：\n\n| 类型 | 为什么容易错 | 确认方式 |\n|------|-------------|----------|\n| 时间节点 | PDF可能过时，口述可能记错 | 「XX年是A还是B？」 |\n| 业务范围边界 | AI会过度泛化或遗漏 | 「旧改是全部还是只做厨卫？」 |\n| 组织层级 | 正式架构 vs 实际运作不同 | 「房产部是一个部还是两个部？」 |\n| 商业模式术语 | C2F/F2C方向性错误 | 「是工厂到消费者还是反过来？」 |\n| 竞品名/人名 | 转录错误、同音字 | 直接给原文确认 |\n\n### 3.2 修正记录格式\n\n每轮修正后记录：\n```markdown\n| 轮次 | 修正点 | 修正前 | 修正后 | 触发人 |\n|------|--------|--------|--------|--------|\n| R1 | 业务模式术语 | C2F | F2C | 用户 |\n```\n\n### 3.3 自查提示词\n\n```\n请审查以下文档，检查：\n\n1. 【判断性语言】有没有出现以下词汇？\n   - \"探索线\"\"试水\"\"没什么水花\"→ 改为中性描述\n   - \"快被砍了\"\"基本放弃\"→ 改为\"当前状态：XXX\"\n\n2. 【信息缺口】对照标准结构，哪些板块完全空白？\n\n3. 【模糊表述】有没有\"等\"\"之类\"\"大概\"可以替换为具体数字或名称？\n\n4. 【内外不分】有没有把「内部管理问题」写成了「外部客户知道的事」？\n   例：❌ \"毛利率不固定\" → 这是内部问题，不需要对外写\n\n5. 【主次颠倒】篇幅分配是否反映了业务实际比重？\n   例：海外业务占10%篇幅但实际只贡献1%营收 → 压缩\n```\n\n---\n\n## 完整复现提示词\n\n以下是可复用的完整提示词，替换 `[ ]` 中的内容即可用于新场景：\n\n```\n我需要你帮我创建一份关于[组织名称]的全面背景文档。\n\n## 目标\n这份文档是「大全版本」——面向所有人的通用信息库。不同角色（新员工、合作方、管理层）从中分拣自己需要的信息。文档必须客观、中立、事实导向。\n\n## 信息来源\n我会分批提供以下资料，请全部吸收后再动笔：\n1. [列出你手上的资料类型，如：公司PDF、会议纪要、复盘档案]\n\n## 文档结构\n按以下结构组织内容：\n\n一、组织概述\n- 基本信息表（全称/定位/成立时间/地点/覆盖范围/资质）\n- 商业模式（一句话+发家逻辑）\n- 发展历程（年份+事件）\n- 背书体系（谁授权+实际价值）\n\n二、业务体系\n- 业务总览表（所有业务线+面向客户+简介）\n- 核心业务展开：货品是什么→卖给谁→解决了谁的问题→为什么选我们\n- 延伸业务简述\n\n三、组织架构与分工\n- 树状架构图\n- 各部门职责表\n\n四、业务流程\n- 主业务全流程（阶段+动作+负责方+产出物）\n- 关键控制点\n\n五、供应链/核心资源\n\n六、关键数据（可量化指标优先，标注来源）\n\n七、行业与竞争（市场定位+竞品+差异化）\n\n## 写作规则\n1. 区分事实和判断——不出现「探索线」「没什么水花」这类判断词\n2. 区分内部和外部——内部管理问题不需要对外写\n3. 区分公司和业务——公司层信息放在第一/三章，业务层信息放在第二/四章\n4. 每条关键数据标注来源（PDF/会议/复盘档案）\n5. 不确定的信息标注「待确认」并列出需要确认的问题\n\n## 迭代规则\n- 第一轮我会看完后给出修正意见\n- 每轮修正记录修改了什么\n- 不要加我没有要求的内容（不擅自扩展、不写宣传文案、不加评论）\n```\n\n---\n\n## 实操备忘（京享家案例）\n\n### 耗时分布\n| 环节 | 占比 | 说明 |\n|------|------|------|\n| 信息收集（PDF提取+文件阅读） | 40% | 3份PDF+15个库内文件 |\n| 初稿生成 | 20% | 按模板填充 |\n| 迭代修正 | 40% | 3轮大改+多轮细节修正 |\n\n### 典型修正路径\n```\nV1：PDF信息拼合 → 被拒（「只是把PDF整合了」）\nV2：加入会议纪要和个人判断 → 被拒（「个人层和政治层不该在通用文档里」）\nV3：纯公司层+中性语言 → 基础认可\nV3→完成：5轮细节修正（术语/范围/逻辑/结构）\n```\n\n### 关键教训\n- AI的第一版永远不会对——因为PDF过时、口述模糊、术语歧义\n- 最有价值的修正来自用户说「不是这样的，其实是XXX」\n- 结构定下来之后，单次修正很快。不要在结构没定的时候追细节\n", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}, {"id": "proj_1122798999588", "name": "项目背景-提示词", "taskDesc": "你是一位经验丰富的创业访谈记者，擅长通过结构化提问帮助创业者梳理项目背景、卡点和转型思路。你的目标是与用户一起完成一份完整的《项目背景复盘档案》，这份档案后续可", "versions": [{"label": "v1", "date": "导入", "prompt": "# 角色设定\n你是一位经验丰富的创业访谈记者，擅长通过结构化提问帮助创业者梳理项目背景、卡点和转型思路。你的目标是与用户一起完成一份完整的《项目背景复盘档案》，这份档案后续可用于内容创作、融资、招商或AI化改造。\n\n# 核心原则\n1. 分多轮提问，不要一次性抛出所有问题。\n2. 每次只问1-3个问题，让用户有足够空间详细回答（用户可能用语音转文字，内容会较长）。\n3. 用户每回答一轮，你就当场整理并展示已收集的信息摘要，让用户确认或补充。\n4. 所有回答都尊重用户原话，不擅自修改事实。\n5. 最终输出一份结构化的档案，包含以下必要章节（可根据实际情况增删）。\n\n# 最终档案的标准结构（目标）\n1. 项目基础定义（一句话、产品形态、服务范围等）\n2. 完整时间线（从0到1到转折点，精确到年月）\n3. 关键数据（如获客量、营收、利润等，有数字最好）\n4. 核心卡点（至少3个，区分“行业固有属性”和“运营致命卡点”）\n5. 可复用资产（私域、供应链、方法论、品牌等）\n6. 转型/AI化动机（内外部原因）\n7. 未来目标（进可攻、退可守的选项）\n8. （可选）已验证但未放大的获客方式\n\n# 分步提问流程（请按顺序执行，每步只问当前问题）\n\n## 第一步：基础定义\n问用户：\n- 你的项目叫什么名字？用一句话说清楚：你在解决谁的什么问题？\n- 产品形态是什么？（线下服务？软件？内容？社群？）\n- 服务范围有地理限制吗？\n\n## 第二步：发展里程碑\n问用户：\n- 请回忆从项目开始到现在，哪几个时间点最重要？（比如：拿到第一个订单、团队变化、盈利转折、差点死掉的时刻）\n- 每个时间点请给出大概的年月。\n\n## 第三步：关键数据\n问用户：\n- 你有记录哪些关键数据？（比如：每月客户量、营收、利润、加微信数、转化率等）\n- 如果有，请提供几个典型月份的数据（最好能看出高峰和低谷）。\n\n## 第四步：核心卡点（最重要）\n问用户：\n- 在项目过程中，你遇到过哪些“差点做不下去”的时刻？请具体描述。\n- 你觉得阻碍项目规模化的最核心的2-3个问题是什么？（不是“行业本来就难”，而是你亲自遇到的、很难解决的）\n- 有没有尝试过找人（合伙人、员工）来解决问题？结果如何？\n\n## 第五步：资源与资产\n问用户：\n- 做了这么久，你积累了什么可以复用的东西？（客户名单、供应链、方法论、品牌资产、内容库等）\n- 有没有被验证过有效、但还没有放大的获客方式或变现路径？\n\n## 第六步：转型动机（如果用户有AI化或其他转型想法）\n问用户：\n- 你现在为什么想转型/用AI改造项目？\n- 你设想的AI化（或其他改造）具体指什么？请用你自己的想法描述，不用太技术化。\n- 改造成功后，你最想达到的目标是什么？（比如：卖掉公司、招商加盟、融资、个人品牌等）\n\n## 第七步：外部环境\n问用户：\n- 有没有外部因素推动你改变？（比如平台规则变化、年龄/家庭原因、职场回归困难等）\n\n## 第八步：收尾\n当以上信息收集完毕后，对用户说：\n“我已经收集完所有信息，现在帮你整理成一份完整的《项目背景复盘档案》。这份档案包含：基础定义、时间线、关键数据、核心卡点、可复用资产、转型动机和未来目标。你可以把这份档案发给任何AI，用于生成文案、商业计划书或融资材料。”\n\n然后输出最终档案，使用清晰的标题和表格。\n\n# 额外注意事项\n- 如果用户回答中时间或数据前后矛盾，请温和地指出并让用户确认。\n- 如果用户提供了非常长的语音转文字内容，请耐心提取关键信息，不要遗漏。\n- 最终档案完成后，建议用户将其保存为单独文件，后续可直接使用。", "output": "", "notes": "从 Obsidian 导入", "effect": "ok", "createdAt": "2026-05-28"}], "createdAt": "2026-05-28"}]};

<body>

<aside>
  <h1>提示词管理</h1>
  <input type="text" id="search-box" placeholder="输入场景或需求，搜索提示词..." oninput="doSearch(this.value)">
  <button onclick="createProject()">+ 新建项目</button>
  <div id="project-list"></div>
  <div id="trash-area" class="trash-section" style="display:none"></div>
  <button class="new-folder-btn" onclick="createGroup()">+ 新建文件夹</button>
  <div class="export-area">
    <button onclick="exportAll()" title="导出所有数据为 JSON">导出</button>
    <button onclick="document.getElementById('import-file').click()" title="从流水账 JSON 恢复">导入JSON</button>
    <button onclick="document.getElementById('import-md-file').click()" title="导入 .md 提示词文件">导入MD</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importAll(event)">
    <input type="file" id="import-md-file" accept=".md" style="display:none" multiple onchange="importMdFiles(event)">
  </div>
</aside>

<!-- 右键菜单 -->
<div class="context-menu" id="context-menu">
  <div class="menu-item" onclick="renameContextItem()">重命名</div>
  <div class="menu-item danger" onclick="deleteContextItem()">删除</div>
</div>

<main>
  <header id="header-area">
    <div style="color:var(--text-muted);padding:40px 0">← 选择一个项目，或新建一个</div>
  </header>
  <div id="content-area"></div>
</main>

<!-- 新建/编辑项目的 Modal -->
<div class="modal-overlay" id="project-modal" style="display:none">
  <div class="modal">
    <h3 id="project-modal-title">新建项目</h3>
    <label>项目名称</label>
    <input id="proj-name" placeholder="例如：公众号推文标题生成">
    <label>任务描述（这个提示词要解决什么问题）</label>
    <textarea id="proj-desc" placeholder="例如：为京享家公众号生成吸引眼球的推文标题，要求语气亲切、有钩子、不做标题党"></textarea>
    <label>分组</label>
    <div style="position:relative">
      <input id="proj-group" placeholder="输入分组名或从列表中选择" autocomplete="off"
             onfocus="showGroupDropdown()" oninput="showGroupDropdown()">
      <div id="group-dropdown" class="group-dropdown" style="display:none"></div>
    </div>
    <label>提示词内容（可选，填入后自动创建 V1.0）</label>
    <textarea id="proj-prompt" placeholder="粘贴你的提示词..."></textarea>
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeModal('project-modal')">取消</button>
      <button class="btn-primary" onclick="saveProject()">保存</button>
    </div>
  </div>
</div>

<!-- 添加版本的 Modal -->
<div class="modal-overlay" id="version-modal" style="display:none">
  <div class="modal">
    <h3 id="version-modal-title">添加新版本</h3>
    <label>提示词内容</label>
    <textarea id="ver-prompt" placeholder="粘贴你的提示词..."></textarea>
    <label>输出结果（模型返回了什么）</label>
    <textarea id="ver-output" placeholder="粘贴模型的输出..." style="min-height:80px"></textarea>
    <label>改动说明（相比上一版改了什么、为什么改）</label>
    <textarea id="ver-notes" placeholder="例如：v1 输出太营销腔，v2 加了负面约束"不用感叹号"，语气变自然了但太干，v3 加了 Few-shot 示例后可用率明显提升"></textarea>
    <label>测试程度</label>
    <select id="ver-effect">
      <option value="untested" selected>未测试 — 尚未经过验证</option>
      <option value="few_shot">五轮内测试 — 初步验证，还需观察</option>
      <option value="well_tested">充分测试 — 多轮验证，稳定可用</option>
    </select>
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeModal('version-modal')">取消</button>
      <button class="btn-primary" onclick="saveVersion()">保存版本</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="body-edit-modal" style="display:none">
  <div class="modal" style="width:800px;max-width:95vw">

    <textarea id="body-edit-textarea" style="min-height:500px;width:100%;background:var(--input-bg);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:16px;font-size:14px;line-height:1.8;font-family:"SF Mono","Fira Code",monospace;resize:vertical"></textarea>

      <button class="btn-primary" onclick="savePromptBody()">保存</button>
    </div>

</div>

<script>
// ===== 数据层 =====
const STORAGE_KEY = 'prompt-engineering-workspace';

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    let d;
    try { d = JSON.parse(raw); } catch(e) { console.error('提示词管理：数据解析失败', e); localStorage.setItem(STORAGE_KEY + '_backup_corrupted', raw); return null; }
    // Migrate: add trash array if missing
    if (!d.trash) d.trash = [];
    // Auto-clean trash: remove items older than 31 days
    const cutoff = Date.now() - 31 * 24 * 60 * 60 * 1000;
    const before = d.trash.length;
    d.trash = d.trash.filter(item => new Date(item.deletedAt).getTime() > cutoff);
    if (d.trash.length !== before) saveData(d);
    // Migrate: auto-group if any project lacks group
    if (d.projects && d.projects.some(p => !p.group)) {
      autoGroupOnSeed(d);
      saveData(d);
    }
    // Migrate: add order field if missing
    if (d.projects && d.projects.some(p => p.order === undefined)) {
      for (let i = 0; i < d.projects.length; i++) {
        if (d.projects[i].order === undefined) d.projects[i].order = i;
      }
      saveData(d);
    }
    // Migrate: add emptyGroups array
    if (!d.emptyGroups) d.emptyGroups = [];
    // Migrate: old effect keys → new test-based keys
    if (d.projects) {
      let effectChanged = false;
      const effectMap = { good: 'well_tested', ok: 'few_shot', bad: 'untested' };
      for (const p of d.projects) {
        for (const v of (p.versions || [])) {
          if (effectMap[v.effect]) { v.effect = effectMap[v.effect]; effectChanged = true; }
        }
      }
      if (effectChanged) saveData(d);
    }
    return d;
  }
  // First time: use seed data + auto group
  if (typeof SEED_DATA !== 'undefined' && SEED_DATA.projects) {
    SEED_DATA.trash = [];
    autoGroupOnSeed(SEED_DATA);
    saveData(SEED_DATA);
    return SEED_DATA;
  }
  return { projects: [], trash: [] };
}

function autoGroupOnSeed(d) {
  const rules = [
    { group: '碎片教室', keys: ['碎片', '碎老师', 'AB老师', 'siyao', '交互式学习', '概念学习', '案例摘要', '学习室'] },
    { group: '打拆AI化', keys: ['打拆', '询价模型', '每日工地', '拆解复盘', '系统设计文档VS提示词'] },
    { group: '内容创作', keys: ['小红书', '前端UI', '课程研发', '二医院', 'PPT', '词汇科普', '风格分析大师', '文小拆'] },
    { group: '效率工具', keys: ['记账', '先别急', '领航员', '明确需求', '安装Claude Code', '教我用Claude', 'AI交互偏好', '项目背景'] },
  ];
  for (const p of d.projects) {
    for (const r of rules) {
      for (const k of r.keys) {
        if ((p.name||'').includes(k) || (p.taskDesc||'').includes(k)) {
          p.group = r.group; break;
        }
      }
      if (p.group) break;
    }
  }
}
function saveData(data) {
  try { const prev = localStorage.getItem(STORAGE_KEY); if (prev) localStorage.setItem(STORAGE_KEY + '_backup', prev); } catch(e) {}
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { console.error('保存失败，可能存储空间不足', e); alert('保存失败，请检查浏览器存储空间'); }
}

let data = loadData();
if (!data) {
  const backup = localStorage.getItem(STORAGE_KEY + '_backup');
  if (backup) { try { data = JSON.parse(backup); } catch(e) {} }
  if (!data) data = { projects: [], trash: [] };
}
let currentProjectId = null;
let compareMode = false;
let compareA = null, compareB = null;
let expandedGroups = new Set();
let collapsedVersions = new Set();

function toggleVersionCard(index) {
  const key = currentProjectId + '_' + index;
  if (collapsedVersions.has(key)) collapsedVersions.delete(key);
  else collapsedVersions.add(key);
  renderVersions();
}
let trashExpanded = false;

// ===== 渲染 =====
let searchQuery = '';

function doSearch(q) {
  searchQuery = q.trim().toLowerCase();
  renderSidebar();
}

function getGroups() {
  const groups = {};
  for (const p of data.projects) {
    const g = p.group || '未分组';
    if (!groups[g]) groups[g] = [];
    groups[g].push(p);
  }
  // Sort within each group by order
  for (const g of Object.values(groups)) {
    g.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  }
  return groups;
}

function updateGroupSuggestions() {} // deprecated, custom dropdown replaces datalist

function autoGroup() {
  const rules = [
    { group: '碎片教室', keys: ['碎片', '碎老师', 'AB老师', 'siyao', '交互式学习', '概念学习', '案例摘要', '学习室', '写作风格分析'] },
    { group: '打拆AI化', keys: ['打拆', '询价模型', '每日工地', '拆解复盘', '系统设计文档VS提示词'] },
    { group: '内容创作', keys: ['小红书', '前端UI', '课程研发', '二医院', 'PPT', '词汇科普', '风格分析', '文小拆'] },
    { group: '效率工具', keys: ['记账', '先别急', '领航员', '明确需求', '安装Claude Code', '教我用Claude', 'AI交互偏好', '项目背景'] },
  ];
  let changed = false;
  for (const p of data.projects) {
    if (p.group) continue;
    for (const r of rules) {
      for (const k of r.keys) {
        if ((p.name||'').includes(k) || (p.taskDesc||'').includes(k) || (p.versions[0]?.prompt||'').includes(k)) {
          p.group = r.group;
          changed = true;
          break;
        }
      }
      if (p.group) break;
    }
  }
  if (changed) saveData(data);
}

function renderSidebar() {
  const list = document.getElementById('project-list');
  if (data.projects.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px">暂无项目，点击上方按钮新建</div>';
    return;
  }

  // When searching, show flat results (no grouping)
  if (searchQuery) {
    const scored = data.projects.map(p => {
      const name = (p.name || '').toLowerCase();
      const desc = (p.taskDesc || '').toLowerCase();
      let score = 0;
      if (name.includes(searchQuery)) score += 100;
      if (desc.includes(searchQuery)) score += 50;
      const words = searchQuery.split(/\s+/);
      for (const w of words) {
        if (!w) continue;
        if (name.includes(w)) score += 20;
        if (desc.includes(w)) score += 10;
      }
      return { project: p, score, name, desc };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

    if (scored.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px">未找到匹配的提示词</div>';
      return;
    }

    list.innerHTML = scored.map(({ project: p }) => `
      <div class="project-item${p.id === currentProjectId ? ' active' : ''}" onclick="selectProject('${p.id}')" oncontextmenu="showContextMenu(event, '${p.id}')">
        <div class="name">${esc(p.name)}</div>
      </div>
    `).join('');
    return;
  }

  // Grouped view
  const groups = getGroups();
  const sorted = Object.entries(groups).sort((a, b) => {
    if (a[0] === '未分组') return 1;
    if (b[0] === '未分组') return -1;
    return a[0].localeCompare(b[0], 'zh');
  });

  let html = '';
  for (const [groupName, projects] of sorted) {
    const gid = 'group_' + groupName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
    const isExpanded = expandedGroups.has(gid);
    html += `
      <div class="group-header${isExpanded ? '' : ' collapsed'}"
           onclick="toggleGroup('${gid}')"
           ondblclick="renameGroupStart(this)"
           oncontextmenu="showGroupContextMenu(event, this)"
           data-group="${esc(groupName)}"
           data-gid="${gid}">
        <span class="arrow">▼</span>
        <span class="group-label">📁 ${esc(groupName)}</span>
        <span class="count">${projects.length}</span>
        <span class="group-actions">
          <button onclick="event.stopPropagation();renameGroupStart(this.closest('.group-header'))" title="重命名">✎</button>
        </span>
      </div>
      <div class="group-children${isExpanded ? '' : ' collapsed'}" id="${gid}">
        ${projects.map(p => `
          <div class="project-item${p.id === currentProjectId ? ' active' : ''}"
               onclick="selectProject('${p.id}')"
               oncontextmenu="showContextMenu(event, '${p.id}')"
               draggable="true"
               data-pid="${esc(p.id)}">
            <div class="name">${esc(p.name)}</div>
          </div>`).join('')}
      </div>`;
  }
  // Render empty groups (no projects yet)
  const projectGroupNames = new Set(Object.keys(groups));
  for (const gname of (data.emptyGroups || [])) {
    if (projectGroupNames.has(gname)) continue;
    const gid = 'group_' + gname.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
    const isExpanded = expandedGroups.has(gid);
    html += `
      <div class="group-header empty-group${isExpanded ? '' : ' collapsed'}"
           onclick="toggleGroup('${gid}')"
           ondblclick="renameGroupStart(this)"
           oncontextmenu="showGroupContextMenu(event, this)"
           data-group="${esc(gname)}"
           data-gid="${gid}">
        <span class="arrow">▼</span>
        <span class="group-label">📁 ${esc(gname)}</span>
        <span class="count" style="color:var(--text-muted)">空</span>
        <span class="group-actions">
          <button onclick="event.stopPropagation();renameGroupStart(this.closest('.group-header'))" title="重命名">✎</button>
        </span>
      </div>
      <div class="group-children${isExpanded ? '' : ' collapsed'}" id="${gid}">
        <div style="padding:6px 8px 6px 22px;font-size:12px;color:var(--text-muted);font-style:italic">拖入项目到此文件夹</div>
      </div>`;
  }
  list.innerHTML = html;

  // Attach drag event listeners via JS (more reliable than inline handlers)
  attachDragListeners(list);
  renderTrash();
}

function attachDragListeners(list) {
  // Drag start on project items
  list.querySelectorAll('.project-item[draggable]').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      const pid = item.dataset.pid;
      draggedProjectId = pid;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', pid);
    });
    item.addEventListener('dragend', (e) => {
      item.classList.remove('dragging');
      document.querySelectorAll('.drag-over, .insert-before, .insert-after').forEach(el => {
        el.classList.remove('drag-over', 'insert-before', 'insert-after');
      });
    });

    // Within-folder sorting: show insert indicator
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const pid = draggedProjectId;
      if (!pid || pid === item.dataset.pid) return;
      item.classList.remove('insert-before', 'insert-after');
      const rect = item.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        item.classList.add('insert-before');
      } else {
        item.classList.add('insert-after');
      }
    });
    item.addEventListener('dragleave', (e) => {
      item.classList.remove('insert-before', 'insert-after');
    });

    // Drop on a project item = sort within folder or move to another folder
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      item.classList.remove('insert-before', 'insert-after');

      const pid = draggedProjectId;
      if (!pid || pid === item.dataset.pid) return;

      const source = data.projects.find(x => x.id === pid);
      const target = data.projects.find(x => x.id === item.dataset.pid);
      if (!source || !target) return;

      const targetGroup = target.group || '';
      const oldGroup = source.group || '';
      const insertBefore = e.clientY < item.getBoundingClientRect().top + item.getBoundingClientRect().height / 2;

      // Get target group projects sorted
      const groupProjects = data.projects
        .filter(p => (p.group || '') === targetGroup)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      // Remove source from its old position in this group (if it was in this group)
      const srcInGroup = groupProjects.findIndex(p => p.id === pid);

      // Find target position in the sorted group
      let targetIdx = groupProjects.findIndex(p => p.id === target.id);
      if (targetIdx < 0) targetIdx = groupProjects.length - 1;

      // Calculate insert position
      let insertIdx = insertBefore ? targetIdx : targetIdx + 1;
      // Adjust if source was before target in same group
      if (srcInGroup >= 0 && srcInGroup < insertIdx) insertIdx--;

      // Build new group order
      if (srcInGroup >= 0) groupProjects.splice(srcInGroup, 1);
      groupProjects.splice(insertIdx, 0, source);

      // Update group and orders for target group
      source.group = targetGroup;
      if (data.emptyGroups && targetGroup) {
        const idx = data.emptyGroups.indexOf(targetGroup);
        if (idx >= 0) data.emptyGroups.splice(idx, 1);
      }
      for (let i = 0; i < groupProjects.length; i++) {
        groupProjects[i].order = i;
      }

      // If source moved from a different group, re-normalize old group orders
      if (oldGroup !== targetGroup) {
        const oldProjects = data.projects
          .filter(p => (p.group || '') === oldGroup && p.id !== pid)
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        for (let i = 0; i < oldProjects.length; i++) {
          oldProjects[i].order = i;
        }
      }

      saveData(data);
      draggedProjectId = null;
      renderSidebar();
    });
  });

  // Drop targets: group headers AND group-children (append when dropped on empty area)
  list.querySelectorAll('.group-header, .group-children').forEach(el => {
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!e.target.closest('.project-item')) el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', (e) => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', (e) => {
      // Skip if a project-item already handled this
      if (e.target.closest('.project-item')) return;
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('drag-over');

      const pid = draggedProjectId;
      if (!pid) return;

      let groupName;
      if (el.classList.contains('group-header')) {
        groupName = el.dataset.group;
      } else {
        const header = el.previousElementSibling;
        groupName = header ? header.dataset.group : null;
      }
      if (!groupName) return;
      groupName = groupName === '未分组' ? '' : groupName;

      const p = data.projects.find(x => x.id === pid);
      if (!p) return;
      const oldGroup = p.group || '';

      // Only move if changing groups (append to end of target)
      if (oldGroup !== groupName) {
        p.group = groupName;
        // Remove from emptyGroups if this was an empty folder
        if (data.emptyGroups) {
          const idx = data.emptyGroups.indexOf(groupName);
          if (idx >= 0) data.emptyGroups.splice(idx, 1);
        }
        // Assign max order + 1 in target group
        const maxOrder = data.projects
          .filter(x => (x.group || '') === groupName && x.id !== pid)
          .reduce((max, x) => Math.max(max, x.order ?? 0), -1);
        p.order = maxOrder + 1;
        // Re-normalize old group
        const oldProjects = data.projects
          .filter(x => (x.group || '') === oldGroup && x.id !== pid)
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        for (let i = 0; i < oldProjects.length; i++) oldProjects[i].order = i;

        saveData(data);
        draggedProjectId = null;
        renderSidebar();
      }
    });
  });
}

function toggleGroup(id) {
  const children = document.getElementById(id);
  if (!children) return;
  const header = children.previousElementSibling;
  const isCurrentlyCollapsed = children.classList.contains('collapsed');

  if (isCurrentlyCollapsed) {
    // Accordion: collapse all other groups first
    document.querySelectorAll('.group-children:not(.collapsed)').forEach(g => {
      g.classList.add('collapsed');
      if (g.previousElementSibling) g.previousElementSibling.classList.add('collapsed');
      expandedGroups.delete(g.id);
    });
    // Expand this one
    children.classList.remove('collapsed');
    if (header) header.classList.remove('collapsed');
    expandedGroups.add(id);
  } else {
    children.classList.add('collapsed');
    if (header) header.classList.add('collapsed');
    expandedGroups.delete(id);
  }
}

// ===== 右键菜单 =====
let contextTargetId = null;
let contextTargetType = null; // 'project' or 'group'

function showContextMenu(e, projectId) {
  e.preventDefault();
  contextTargetId = projectId;
  contextTargetType = 'project';
  const menu = document.getElementById('context-menu');
  menu.innerHTML = `
    <div class="menu-item" onclick="renameContextItem()">重命名</div>
    <div class="menu-item danger" onclick="deleteContextItem()">删除</div>
  `;
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
}

function showGroupContextMenu(e, el) {
  e.preventDefault();
  e.stopPropagation();
  contextTargetId = el.dataset.group;
  contextTargetType = 'group';
  const menu = document.getElementById('context-menu');
  // Check if this is an empty group (only in emptyGroups, no projects)
  const groupName = contextTargetId;
  const isEmpty = (data.emptyGroups || []).includes(groupName) && !data.projects.some(p => (p.group || '未分组') === groupName);
  menu.innerHTML = `
    <div class="menu-item" onclick="renameContextItem()">重命名文件夹</div>
    ${isEmpty ? `<div class="menu-item danger" onclick="deleteEmptyGroup()">删除文件夹</div>` : ''}
  `;
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
}

function hideContextMenu() {
  document.getElementById('context-menu').style.display = 'none';
  contextTargetId = null;
  contextTargetType = null;
}

function renameContextItem() {
  hideContextMenu();
  if (contextTargetType === 'project') {
    const p = data.projects.find(x => x.id === contextTargetId);
    if (!p) return;
    const newName = prompt('新名称：', p.name);
    if (newName && newName.trim()) { p.name = newName.trim(); saveData(data); renderAll(); }
  } else if (contextTargetType === 'group') {
    const newName = prompt('新文件夹名称：', contextTargetId);
    if (newName && newName.trim() && newName.trim() !== contextTargetId) {
      for (const p of data.projects) {
        if ((p.group || '未分组') === contextTargetId) p.group = newName.trim();
      }
      if (data.emptyGroups) {
        const idx = data.emptyGroups.indexOf(contextTargetId);
        if (idx >= 0) data.emptyGroups[idx] = newName.trim();
      }
      saveData(data); renderAll();
    }
  }
}

function deleteContextItem() {
  const id = contextTargetId;
  const type = contextTargetType;
  hideContextMenu();
  if (type === 'project') {
    deleteProject(id);
  }
}

document.addEventListener('click', hideContextMenu);
document.addEventListener('scroll', hideContextMenu);

// ===== 文件夹管理 =====
function deleteEmptyGroup() {
  const gname = contextTargetId;
  hideContextMenu();
  if (!confirm('确定要删除空文件夹 "' + gname + '" 吗？')) return;
  if (data.emptyGroups) {
    const idx = data.emptyGroups.indexOf(gname);
    if (idx >= 0) data.emptyGroups.splice(idx, 1);
    saveData(data);
    renderAll();
  }
}

function renameGroupStart(el) {
  event.stopPropagation();
  const label = el.querySelector('.group-label');
  const oldName = el.dataset.group;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'group-rename-input';
  input.value = oldName;
  input.onblur = () => { renameGroupCommit(oldName, input.value.trim(), el); };
  input.onkeydown = (e) => {
    if (e.key === 'Enter') renameGroupCommit(oldName, input.value.trim(), el);
    if (e.key === 'Escape') { input.remove(); label.style.display = ''; }
  };
  label.style.display = 'none';
  label.parentNode.insertBefore(input, label.nextSibling);
  input.focus();
  input.select();
}

function renameGroupCommit(oldName, newName, el) {
  const label = el.querySelector('.group-label');
  const input = el.querySelector('.group-rename-input');
  if (input) input.remove();
  label.style.display = '';
  if (!newName || newName === oldName) return;
  for (const p of data.projects) {
    if ((p.group || '未分组') === oldName) p.group = newName;
  }
  if (data.emptyGroups) {
    const idx = data.emptyGroups.indexOf(oldName);
    if (idx >= 0) data.emptyGroups[idx] = newName;
  }
  saveData(data);
  renderSidebar();
}

function createGroup() {
  const name = prompt('输入新文件夹名称：');
  if (!name || !name.trim()) return;
  const gname = name.trim();
  const groups = getGroups();
  if (groups[gname]) { alert('该文件夹已存在'); return; }
  if ((data.emptyGroups || []).includes(gname)) { alert('该文件夹已存在'); return; }
  if (!data.emptyGroups) data.emptyGroups = [];
  data.emptyGroups.push(gname);
  saveData(data);
  renderAll();
}

function showGroupDropdown() {
  const input = document.getElementById('proj-group');
  const dropdown = document.getElementById('group-dropdown');
  const filter = input.value.trim().toLowerCase();
  const groups = getGroups();
  const allNames = new Set([...Object.keys(groups), ...(data.emptyGroups || [])]);
  let names = [...allNames].filter(n => n.toLowerCase().includes(filter));
  if (names.length === 0 && !filter) {
    dropdown.innerHTML = `<div class="group-dropdown-item new-group" onmousedown="event.preventDefault();clickNewGroupBtn()">+ 新建文件夹</div>`;
  } else {
    dropdown.innerHTML = names.map(n => {
      const hasProjects = !!groups[n];
      const label = hasProjects ? `📁 ${esc(n)}` : `📁 ${esc(n)} <span style="color:var(--text-muted);font-size:11px">空</span>`;
      return `<div class="group-dropdown-item" data-gname="${esc(n)}">${label}</div>`;
    }).join('') + `<div class="group-dropdown-item new-group" onmousedown="event.preventDefault();clickNewGroupBtn()">+ 新建文件夹</div>`;

    dropdown.querySelectorAll('.group-dropdown-item[data-gname]').forEach(el => {
      el.addEventListener('mousedown', function(e) {
        e.preventDefault();
        selectGroup(el.dataset.gname);
      });
    });

  dropdown.style.display = 'block';
}

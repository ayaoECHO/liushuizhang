async function copyPrompt(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const text = el.tagName === 'TEXTAREA' ? el.value : el.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  // Visual feedback on all copy buttons
  const btns = document.querySelectorAll('.copy-btn');
  for (const btn of btns) {
    btn.textContent = '已复制';
    btn.classList.add('copied');
  }
  setTimeout(() => {
    for (const btn of btns) {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }
  }, 1200);
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = esc(text);
  // 代码块（必须在行内代码之前处理）
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  // 标题
  html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 水平线
  html = html.replace(/^---$/gm, '<hr>');
  // 加粗和斜体
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 链接
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // 无序列表
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)\n?(?!<li>)/g, '$1</ul>');
  html = html.replace(/(?<!<\/ul>\n)(?<!^)<li>/g, '<ul>\n<li>');
  // 段落（连续换行 → 段落）
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/^(?!<[a-z])/gm, (match) => match === '' ? '' : match);
  html = '<p>' + html + '</p>';
  // 清理空段落
  html = html.replace(/<p><\/p>/g, '');
  // 清理段落内嵌的块级元素造成的多余 <p>
  html = html.replace(/<p>(<(?:h[1-6]|pre|ul|ol|hr|table)[\s\S]*?)<\/p>/g, '$1');
  return html;
}

function computeDiff(a, b) {
  const linesA = a.split('\n');
  const linesB = b.split('\n');
  const m = linesA.length, n = linesB.length;
  const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (linesA[i - 1] === linesB[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  const result = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && linesA[i - 1] === linesB[j - 1]) {
      result.unshift({ type: 'eq', text: linesA[i - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      result.unshift({ type: 'add', text: linesB[j - 1] });
      j--;
    } else {
      result.unshift({ type: 'del', text: linesA[i - 1] });
      i--;
    }
  }
  return result;
}

function renderDiffLines(diff) {
  if (!diff.length) return '<div class="diff-line eq">（无内容）</div>';
  return diff.map(d => {
    const cls = d.type === 'add' ? 'add' : d.type === 'del' ? 'del' : 'eq';
    const text = d.text === '' ? ' ' : esc(d.text);
    return `<div class="diff-line ${cls}">${text}</div>`;
  }).join('');
}

function versionCard(v, index) {
  const effectMap = { well_tested: '充分测试', few_shot: '五轮内测试', untested: '未测试' };
  const effectClass = effectMap[v.effect] ? v.effect : 'untested';
  const effectText = effectMap[v.effect] || '未测试';
  const label = v.label || 'v' + (index + 1);
  const rawPrompt = v.prompt || '';
  const promptText = esc(rawPrompt);
  const renderedHTML = renderMarkdown(rawPrompt);
  const promptId = 'prompt_' + index + '_' + Date.now();
  const collapsed = collapsedVersions.has(currentProjectId + '_' + index);
  return `
    <div class="version-card${collapsed ? ' collapsed' : ''}" id="vcard_${index}">
      <div class="card-header" onclick="toggleVersionCard(${index})" style="cursor:pointer">
        <span class="ver-left">
          <span class="ver-label">${esc(label)}</span>
          <button class="header-action-btn" onclick="event.stopPropagation();editVersion(${index})">版本修改</button>
          <button class="header-action-btn danger" onclick="event.stopPropagation();deleteVersion('${currentProjectId}', ${index})">删除</button>
          <button class="header-action-btn" onclick="event.stopPropagation();editPromptBody(${index})">正文编辑</button>
        </span>
        <span class="ver-date">${esc(v.date || '')} &nbsp; <span class="effect-badge ${effectClass}">${effectText}</span> &nbsp; <button class="copy-btn" onclick="copyPrompt('${promptId}_raw')">复制</button></span>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="field-label">提示词正文</div>
          <div class="field-content rendered" id="${promptId}">${renderedHTML}</div>
          <textarea id="${promptId}_raw" style="display:none">${promptText}</textarea>
          <div id="prompt-edit-${index}" style="display:none"></div>
        </div>
        ${v.output ? `
        <div class="field">
          <div class="field-label">输出结果</div>
          <div class="field-content">${esc(v.output)}</div>
        </div>` : ''}
        ${v.notes ? `
        <div class="field">
          <div class="field-label">改动说明</div>
          <div class="field-content">${esc(v.notes)}</div>
        </div>` : ''}
      </div>
    </div>
  `;
}

// ===== 操作 =====
function selectProject(id) {
  currentProjectId = id;
  compareMode = false;
  compareA = null; compareB = null;
  renderAll();
}

function createProject() {
  clearSearch();
  document.getElementById('project-modal-title').textContent = '新建项目';
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-desc').value = '';
  document.getElementById('proj-group').value = '';
  document.getElementById('proj-prompt').value = '';
  document.getElementById('project-modal').dataset.editId = '';
  document.getElementById('project-modal').style.display = 'flex';
}

function editProject(id) {
  const p = data.projects.find(x => x.id === id);
  if (!p) return;
  document.getElementById('project-modal-title').textContent = '编辑项目';
  document.getElementById('proj-name').value = p.name;
  document.getElementById('proj-desc').value = p.taskDesc || '';
  document.getElementById('proj-group').value = p.group || '';
  document.getElementById('project-modal').dataset.editId = id;
  document.getElementById('project-modal').style.display = 'flex';
}

function saveProject() {
  const name = document.getElementById('proj-name').value.trim();
  const taskDesc = document.getElementById('proj-desc').value.trim();
  const group = document.getElementById('proj-group').value.trim();
  if (!name) return;
  const editId = document.getElementById('project-modal').dataset.editId;
  if (editId) {
    const p = data.projects.find(x => x.id === editId);
    if (p) { p.name = name; p.taskDesc = taskDesc; p.group = group || ''; }
    saveData(data);
    closeModal('project-modal');
    renderAll();
  } else {
    const projPrompt = document.getElementById('proj-prompt').value.trim();
    const versions = projPrompt ? [{
      label: 'V1.0',
      date: new Date().toLocaleDateString('zh-CN'),
      prompt: projPrompt,
      output: '',
      notes: '',
      effect: 'untested',
      createdAt: new Date().toISOString()
    }] : [];
    const newId = 'proj_' + Date.now();
    data.projects.push({
      id: newId,
      name, taskDesc,
      group: group || '',
      versions,
      createdAt: new Date().toISOString()
    });
    // Remove from emptyGroups if this project created a group
    if (group && data.emptyGroups) {
      const idx = data.emptyGroups.indexOf(group);
      if (idx >= 0) data.emptyGroups.splice(idx, 1);
    }
    saveData(data);
    closeModal('project-modal');
    currentProjectId = newId;
    renderAll();
  }
}

function deleteProject(id) {
  if (!confirm('确定要删除这个项目及其所有版本吗？将移入垃圾箱，31天后自动清空。')) return;
  const idx = data.projects.findIndex(x => x.id === id);
  if (idx === -1) return;
  const [removed] = data.projects.splice(idx, 1);
  data.trash = data.trash || [];
  data.trash.push({
    ...removed,
    deletedAt: new Date().toISOString()
  });
  if (currentProjectId === id) { currentProjectId = null; compareMode = false; }
  saveData(data);
  renderAll();
}

function restoreFromTrash(index) {
  const [item] = data.trash.splice(index, 1);
  const { deletedAt, ...project } = item;
  data.projects.push(project);
  saveData(data);
  renderAll();
}

function deleteFromTrashPermanently(index) {
  if (!confirm('确定要永久删除吗？此操作不可恢复。')) return;
  data.trash.splice(index, 1);
  saveData(data);
  renderAll();
}

function emptyTrash() {
  if (data.trash.length === 0) return;
  if (!confirm(`垃圾箱中有 ${data.trash.length} 个项目，确定全部永久删除吗？此操作不可恢复。`)) return;
  data.trash = [];
  saveData(data);
  renderAll();
}

function toggleTrash() {
  trashExpanded = !trashExpanded;
  renderTrash();
}

function renderTrash() {
  const area = document.getElementById('trash-area');
  if (!data.trash || data.trash.length === 0) {
    area.style.display = 'none';
    return;
  }
  area.style.display = 'block';
  const days = (d) => {
    const diff = Date.now() - new Date(d).getTime();
    const remaining = Math.max(0, 31 - Math.floor(diff / (24 * 60 * 60 * 1000)));
    return remaining;
  };
  area.innerHTML = `
    <div class="trash-header${trashExpanded ? '' : ' collapsed'}" onclick="toggleTrash()">
      <span class="arrow">▼</span>
      <span>🗑️ 垃圾箱</span>
      <span class="count">${data.trash.length}</span>
    </div>
    <div class="trash-children${trashExpanded ? '' : ' collapsed'}">
      ${data.trash.map((item, i) => `
        <div class="trash-item" oncontextmenu="showTrashContextMenu(event, ${i})">
          <div class="trash-name">${esc(item.name)}</div>
          <div class="trash-date">删除于 ${new Date(item.deletedAt).toLocaleDateString('zh-CN')} · ${days(item.deletedAt)}天后清空</div>
        </div>
      `).join('')}
      <button class="trash-empty-btn" onclick="emptyTrash()">清空垃圾箱</button>
    </div>
  `;
}

let contextTrashIndex = null;
function showTrashContextMenu(e, index) {
  e.preventDefault();
  contextTrashIndex = index;
  const menu = document.getElementById('context-menu');
  menu.innerHTML = `
    <div class="menu-item" onclick="restoreFromTrash(contextTrashIndex);hideContextMenu()">恢复</div>
    <div class="menu-item danger" onclick="deleteFromTrashPermanently(contextTrashIndex);hideContextMenu()">永久删除</div>
  `;
  menu.style.display = 'block';
  menu.style.left = Math.min(e.clientX, window.innerWidth - 150) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 80) + 'px';
}

function addVersion() {
  document.getElementById('version-modal-title').textContent = '添加新版本';
  document.getElementById('ver-prompt').value = '';
  document.getElementById('ver-output').value = '';
  document.getElementById('ver-notes').value = '';
  document.getElementById('ver-effect').value = 'untested';
  document.getElementById('version-modal').dataset.editIndex = '';
  document.getElementById('version-modal').style.display = 'flex';
}

function editVersion(index) {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || !p.versions[index]) return;
  const v = p.versions[index];
  document.getElementById('version-modal-title').textContent = '修改版本';
  document.getElementById('ver-prompt').value = v.prompt || '';
  document.getElementById('ver-output').value = v.output || '';
  document.getElementById('ver-notes').value = v.notes || '';
  document.getElementById('ver-effect').value = v.effect || 'untested';
  document.getElementById('version-modal').dataset.editIndex = index;
  document.getElementById('version-modal').style.display = 'flex';
}

function saveVersion() {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p) return;
  const prompt = document.getElementById('ver-prompt').value.trim();
  if (!prompt) return;
  const editIndex = document.getElementById('version-modal').dataset.editIndex;
  const data_obj = {
    prompt,
    output: document.getElementById('ver-output').value.trim(),
    notes: document.getElementById('ver-notes').value.trim(),
    effect: document.getElementById('ver-effect').value
  };
  p.versions = p.versions || [];
  if (editIndex !== '') {
    // Edit existing version
    Object.assign(p.versions[parseInt(editIndex)], data_obj);
  } else {
    const vNum = p.versions.length + 1;
    p.versions.push(Object.assign(data_obj, {
      label: 'v' + vNum,
      date: new Date().toLocaleDateString('zh-CN'),
      createdAt: new Date().toISOString()
    }));
  }
  saveData(data);
  closeModal('version-modal');
  renderAll();
}

function deleteVersion(projId, index) {
  if (!confirm('删除此版本？')) return;
  const p = data.projects.find(x => x.id === projId);
  if (!p) return;
  p.versions.splice(index, 1);
  saveData(data);
  if (compareA === index) compareA = null;
  if (compareB === index) compareB = null;
  renderAll();
}

function editPromptInline(index) {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || !p.versions[index]) return;
  const v = p.versions[index];
  const rawPrompt = v.prompt || '';
  const editArea = document.getElementById('prompt-edit-' + index);
  if (!editArea) return;
  // Hide rendered view and label
  const field = editArea.closest('.field');

  if (rendered) rendered.style.display = 'none';
  if (label) label.style.display = 'none';

  editArea.innerHTML = `
    <textarea class="inline-edit-textarea" id="prompt-editor-${index}">${esc(rawPrompt)}</textarea>
    <div class="inline-edit-actions">
      <button onclick="savePromptInline(${index})">保存</button>
      <button class="btn-cancel" onclick="cancelPromptInline(${index})">取消</button>
    </div>
  `;
  document.getElementById('prompt-editor-' + index).focus();
}

function savePromptInline(index) {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || !p.versions[index]) return;
  const editor = document.getElementById('prompt-editor-' + index);
  if (!editor) return;
  p.versions[index].prompt = editor.value;
  saveData(data);
  renderAll();
}

function cancelPromptInline(index) {
  renderAll();
}

let bodyEditIndex = null;

function editPromptBody(index) {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || !p.versions[index]) return;
  bodyEditIndex = index;
  const card = document.getElementById('vcard_' + index);
  if (!card) return;
  // Expand if collapsed
  if (card.classList.contains('collapsed')) {
    collapsedVersions.delete(currentProjectId + '_' + index);
    card.classList.remove('collapsed');
  }
  const body = card.querySelector('.card-body');
  const rawPrompt = p.versions[index].prompt || '';
  body.innerHTML = `
    <textarea class="body-edit-textarea" id="body-edit-textarea">${esc(rawPrompt)}</textarea>
    <div class="body-edit-actions">
      <button onclick="savePromptBody()">保存</button>
      <button class="btn-cancel" onclick="cancelPromptBody()">取消</button>
    </div>
  `;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('body-edit-textarea').focus();
}

function savePromptBody() {
  if (bodyEditIndex === null) return;
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || !p.versions[bodyEditIndex]) return;
  p.versions[bodyEditIndex].prompt = document.getElementById('body-edit-textarea').value;
  saveData(data);
  bodyEditIndex = null;
  renderAll();
}

function cancelPromptBody() {
  bodyEditIndex = null;
  renderAll();
}


function toggleCompare() {
  const p = data.projects.find(x => x.id === currentProjectId);
  if (!p || (p.versions||[]).length < 2) {
    alert('需要至少 2 个版本才能对比');
    return;
  }
  compareMode = !compareMode;
  if (compareMode) {
    compareA = p.versions.length - 2;
    compareB = p.versions.length - 1;
  } else {
    compareA = null; compareB = null;
  }
  renderAll();
}

function updateCompare() {
  const selA = document.getElementById('compare-select-a');
  const selB = document.getElementById('compare-select-b');
  if (selA) compareA = parseInt(selA.value);
  if (selB) compareB = parseInt(selB.value);
  renderVersions();
}

function exportAll() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '提示词工程_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
}

function importAll(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.projects) throw new Error('格式不对');
      if (!confirm(`即将导入 ${imported.projects.length} 个项目。这会覆盖当前数据，确定吗？`)) return;
      data = imported;
      saveData(data);
      currentProjectId = null; compareMode = false;
      clearSearch();
      renderAll();
    } catch(err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function importMdFiles(event) {
  const files = event.target.files;
  if (!files.length) return;
  const added = [];
  for (const file of files) {
    const content = await file.text();
    const name = file.name.replace(/\.md$/i, '');
    // Extract first heading as description
    const lines = content.split('\n');
    let desc = '';
    for (const l of lines) {
      const t = l.trim();
      if (t.startsWith('# ') && !t.startsWith('## ')) {
        desc = t.replace(/^#+\s*/, '');
        break;
      }
    }
    if (!desc) {
      // Use first non-empty, non-frontmatter line
      for (const l of lines) {
        const t = l.trim();
        if (t && !t.startsWith('---') && !t.startsWith('tags:') && !t.startsWith('#')) {
          desc = t.substring(0, 80);
          break;
        }
      }
    }
    data.projects.push({
      id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name,
      taskDesc: desc || '',
      versions: [{
        label: 'v1',
        date: new Date().toLocaleDateString('zh-CN'),
        prompt: content,
        output: '',
        notes: '从 MD 文件导入',
        effect: 'untested',
        createdAt: new Date().toISOString()
      }],
      createdAt: new Date().toISOString()
    });
    added.push(name);
  }
  saveData(data);
  renderAll();
  alert(`已导入 ${added.length} 个文件：\n${added.join('\n')}`);
  event.target.value = '';
}

// ===== 工具函数 =====
function clearSearch() {
  searchQuery = '';
  const box = document.getElementById('search-box');
  if (box) box.value = '';
}
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}
function renderAll() {
  renderSidebar();
  renderHeader();
  renderVersions();
}

// 点击遮罩关闭
document.getElementById('project-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('project-modal');
});
document.getElementById('version-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('version-modal');
});

// 初始渲染
renderAll();
</script>

<script>
// ===== 自动数据同步 ===== (localStorage 拦截器)
(function() {
  const SYNC_APP = "提示词管理";
  const SYNC_KEYS = new Set(["prompt-engineering-workspace"]);
  let _syncTimer = null;
  const SYNC_URL = 'http://localhost:9879/sync';

  function doSync() {
    const payload = { app: SYNC_APP, keys: {} };
    SYNC_KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v !== null) {
        try { payload.keys[k] = JSON.parse(v); } catch(e) { payload.keys[k] = v; }
      }
    });
    try { fetch(SYNC_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{}); } catch(e) {}
  }

  function debouncedSync() {
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(doSync, 30000);
  }

  // 拦截 localStorage.setItem — 只要是同步的 key 被写入，就触发防抖同步
  const _origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(key, value) {
    _origSetItem(key, value);
    if (SYNC_KEYS.has(key)) debouncedSync();
  };

  // 页面隐藏/关闭时立即同步
  document.addEventListener('visibilitychange', () => { if (document.hidden) doSync(); });
  window.addEventListener('beforeunload', doSync);

  // 启动时：如果 localStorage 为空，尝试从磁盘恢复
  (function recover() {
    let missing = [];
    SYNC_KEYS.forEach(k => { if (!localStorage.getItem(k)) missing.push(k); });
    if (missing.length === 0 || missing.length === SYNC_KEYS.size) {
      // 全部有数据 → 不需要恢复。全部没数据 → 可能是第一次用，等页面渲染完再说
      if (missing.length === SYNC_KEYS.size) {
        // 逐个尝试恢复
        SYNC_KEYS.forEach(k => {
          try {
            fetch('http://localhost:9879/' + SYNC_APP + '/' + k)
              .then(r => r.ok ? r.json() : null)
              .then(d => {
                if (d && d.data !== undefined) {
                  _origSetItem(k, JSON.stringify(d.data));
                  console.log('从磁盘恢复:', k);
                }
              })
              .catch(() => {});
          } catch(e) {}
        });
      }
    }
  })();
})();
</script>
